<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#E23636;--gold:#C9973A;
  --ms:#3A7BD5;--mtv:#2ECC71;--fox:#E67E22;--sony:#9B59B6;--other:#888;
  --bg:#111;--bg2:#1a1a1a;--bg3:#222;--border:#333;--text:#eee;--muted:#888;
}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:calc(.6rem + env(safe-area-inset-top)) 1rem .6rem;position:sticky;top:0;z-index:50}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.logo{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:1.5px;color:var(--red);line-height:1;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sub{display:none}
.header-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.icon-btn{width:28px;height:28px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;flex-shrink:0}
.icon-btn:hover{border-color:var(--red);color:var(--red)}
.admin-btn{background:var(--bg3);border:1px solid var(--border);color:var(--muted);font-size:10px;padding:5px 10px;border-radius:12px;cursor:pointer;letter-spacing:.5px;white-space:nowrap;flex-shrink:0}
.admin-btn.active{border-color:var(--gold);color:var(--gold)}

.stats-bar{display:flex;justify-content:center;gap:1.75rem;margin:10px 0 0;flex-wrap:wrap}
.stat{text-align:center}
.stat-val{font-size:18px;font-weight:600;color:var(--text)}
.stat-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.progress-wrap{margin:8px auto 0;max-width:400px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:2px;transition:width .5s}

.controls{background:var(--bg2);border-bottom:1px solid var(--border);padding:.6rem 1rem;position:sticky;top:82px;z-index:40}
.controls-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.controls-row + .controls-row{margin-top:8px}
.search{flex:1;min-width:120px;padding:6px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;color:var(--text);font-size:13px;outline:none}
.search:focus{border-color:var(--red)}
.view-icons{display:flex;gap:4px;flex-shrink:0}
.icon-toggle{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;flex-shrink:0}
.icon-toggle.on{border-color:var(--gold);color:var(--gold);background:rgba(201,151,58,.12)}
.segmented{display:flex;background:var(--bg3);border-radius:16px;padding:2px;gap:2px;flex-shrink:0}
.segmented button{border:none;background:transparent;color:var(--muted);font-size:11px;padding:6px 12px;border-radius:14px;cursor:pointer;font-weight:500;white-space:nowrap}
.segmented button.on{background:var(--red);color:#fff}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{padding:4px 12px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;cursor:pointer;white-space:nowrap}
.fbtn.on{border-color:var(--gold);color:var(--gold)}
.admin-row{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
.admin-label{font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;font-weight:700;flex-shrink:0}
.add-btn{padding:5px 14px;border-radius:14px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:12px;cursor:pointer;font-weight:600;white-space:nowrap}

.container{max-width:1100px;margin:0 auto;padding:1rem;padding-bottom:calc(2rem + env(safe-area-inset-bottom))}

.studio-section{margin-bottom:2rem}
.studio-header{display:flex;align-items:center;gap:10px;padding:.5rem 0;margin-bottom:.75rem;cursor:pointer;user-select:none}
.studio-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.studio-name{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;flex:1}
.studio-prog{font-size:12px;color:var(--muted)}
.studio-bar{height:3px;background:var(--border);border-radius:2px;margin-bottom:.75rem;overflow:hidden}
.studio-bar-fill{height:100%;border-radius:2px;transition:width .4s}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;position:relative}
.card:hover{border-color:#555;background:var(--bg3)}
.card.watched{border-left:3px solid var(--red)}
.card-studio{font-size:9px;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin-bottom:2px}
.card-title{font-size:12px;font-weight:500;line-height:1.3;margin-bottom:4px;padding-right:20px}
.card-meta{font-size:10px;color:var(--muted)}
.card-check{position:absolute;top:8px;right:8px;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;background:transparent}
.card.watched .card-check{background:var(--red);border-color:var(--red);color:#fff}
.card-stars{display:flex;gap:1px;margin-top:4px}
.star{font-size:11px;color:var(--border);cursor:pointer}
.star.lit{color:var(--gold)}

.mosaic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.mosaic-item{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;cursor:pointer;background:#111;border:2px solid transparent}
.mosaic-item.watched{border-color:#2ecc71}
.mosaic-item img{width:100%;height:100%;object-fit:cover;display:block}
.mosaic-item-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:6px;text-align:center;font-size:9px;color:#ddd;background:var(--bg2)}
.mosaic-check{position:absolute;top:4px;right:4px;width:14px;height:14px;border-radius:50%;background:#2ecc71;color:#fff;font-size:7px;display:flex;align-items:center;justify-content:center}

.empty-msg{text-align:center;color:var(--muted);padding:3rem 1rem;font-size:13px}

/* Panels / modals */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:calc(1rem + env(safe-area-inset-top)) 1rem calc(1rem + env(safe-area-inset-bottom));overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:1.5rem;width:100%;max-width:420px;margin:0 auto}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1px;color:var(--red);margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px;font-family:inherit}
.btn-row{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;padding:10px;border-radius:8px;border:none;font-size:13px;font-weight:500;cursor:pointer}
.btn-primary{background:var(--red);color:#fff}
.btn-secondary{background:var(--bg3);border:1px solid var(--border);color:var(--muted)}
.tmdb-result{display:flex;gap:10px;padding:8px;border-radius:8px;cursor:pointer;align-items:center}
.tmdb-result:hover{background:var(--bg3)}
.tmdb-result img{width:40px;height:60px;object-fit:cover;border-radius:4px;background:#333}
.tmdb-result-title{font-size:13px;font-weight:500}
.tmdb-result-meta{font-size:10px;color:var(--muted)}
.season-row{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid var(--border)}
.season-row:last-child{border-bottom:none}
.season-row input[type=checkbox]{width:16px;height:16px;flex-shrink:0}
.season-row-title{font-size:12px;font-weight:500}
.season-row-meta{font-size:10px;color:var(--muted)}
.back-link{font-size:11px;color:var(--muted);cursor:pointer;margin-bottom:10px;display:inline-block}
.studiomgr-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
.studiomgr-row:last-child{border-bottom:none}
.studiomgr-row input[type=color]{width:32px;height:32px;border:none;background:none;padding:0;flex-shrink:0;cursor:pointer}
.studiomgr-row input[type=text]{flex:1;padding:6px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px}
.studiomgr-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:4px 6px}
.studiomgr-del:hover{color:var(--red)}
.studio-actions{display:flex;gap:6px}
.manage-card{padding-left:40px}
.manage-checkbox{position:absolute;top:14px;left:12px;width:18px;height:18px;cursor:pointer;accent-color:var(--gold)}
.studio-mini-btn{font-size:9px;padding:2px 7px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer}
.studio-mini-btn:hover{border-color:var(--gold);color:var(--gold)}

.detail-poster-wrap{position:relative;margin:0;border-radius:14px 14px 0 0;overflow:hidden}
.detail-poster{width:100%;max-height:320px;object-fit:cover;display:block;background:#333}
.detail-poster-scrim{position:absolute;inset:0;background:linear-gradient(to bottom, transparent 40%, var(--bg2) 100%)}
.detail-body{padding:14px 1.5rem 1.5rem}
.detail-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.detail-badge{font-size:10px;padding:3px 9px;border-radius:10px;font-weight:600;letter-spacing:.3px}
.detail-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;margin-bottom:8px;line-height:1.05}
.detail-overview{font-size:13px;line-height:1.6;color:#ccc;margin-bottom:16px}
.detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.detail-actions .btn{flex:none;padding:9px 16px}
.detail-rating-row{display:flex;align-items:center;gap:10px;padding-top:6px;border-top:1px solid var(--border)}
.detail-rating-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

.ep-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px}
.ep-header-count{font-size:12px;color:var(--gold);font-weight:600}
.ep-actions{display:flex;gap:6px}
.ep-progress-wrap{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:12px}
.ep-progress-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:2px}
.ep-list{max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:8px}
.ep-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer}
.ep-row:last-child{border-bottom:none}
.ep-row:hover{background:var(--bg3)}
.ep-row input[type=checkbox]{width:16px;height:16px;flex-shrink:0;accent-color:var(--gold);cursor:pointer}
.ep-num{font-size:10px;color:var(--muted);flex-shrink:0;width:26px}
.ep-title{font-size:12px;flex:1}
.close-x{position:absolute;top:10px;right:10px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;cursor:pointer;background:rgba(0,0,0,.5);border:none;border-radius:50%}
.detail-nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;border:none;z-index:2}
.detail-nav:disabled{opacity:.25;cursor:default}
.detail-nav.prev{left:10px}
.detail-nav.next{right:10px}

@media (min-width:700px){
  .controls{top:76px}
}

/* ── Timelines ── */
.segmented{display:flex;background:var(--bg3);border-radius:16px;padding:2px;gap:2px}
.segmented button{border:none;background:transparent;color:var(--muted);font-size:11px;padding:6px 12px;border-radius:14px;cursor:pointer;white-space:nowrap;font-weight:500}
.segmented button.on{background:var(--red);color:#fff}
.admin-tools{display:flex;gap:6px;flex-wrap:wrap}
.mini-btn{padding:5px 12px;border-radius:14px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:11px;cursor:pointer;font-weight:600;white-space:nowrap}
.board-wrap{overflow-x:auto;overflow-y:hidden;padding:20px 16px 40px;position:relative}
.board{display:flex;gap:28px;position:relative;min-height:200px}
.uni-col{width:200px;flex-shrink:0}
.uni-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid}
.uni-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.uni-name{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.5px}
.uni-trunk{display:flex;flex-direction:column;gap:10px}
.uni-branches{display:flex;gap:14px;margin-top:10px}
.uni-branch{flex:1;display:flex;flex-direction:column;gap:10px;position:relative;padding-top:16px}
.uni-branch::before{content:'';position:absolute;top:0;left:50%;width:1px;height:16px;background:var(--border)}
.branch-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;text-align:center;margin-bottom:2px}
.tcard{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px;cursor:pointer;position:relative;font-size:11px}
.tcard.watched{border-left:3px solid var(--red)}
.tcard-title{font-weight:500;line-height:1.3;margin-bottom:2px;padding-right:16px}
.tcard-meta{font-size:9px;color:var(--muted)}
.tcard-check{position:absolute;top:6px;right:6px;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:8px}
.tcard.watched .tcard-check{background:var(--red);border-color:var(--red);color:#fff}
.tcard-assign{position:absolute;top:6px;left:6px;font-size:11px;color:var(--gold);opacity:.85}
svg.links-svg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
.link-label{fill:var(--muted);font-size:9px}
.unimgr-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
.unimgr-row:last-child{border-bottom:none}
.unimgr-row input[type=color]{width:30px;height:30px;border:none;background:none;padding:0;flex-shrink:0;cursor:pointer}
.unimgr-row input[type=text]{flex:1;padding:6px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px}
.unimgr-order{display:flex;flex-direction:column;gap:2px}
.unimgr-order button{background:none;border:1px solid var(--border);color:var(--muted);width:20px;height:16px;font-size:9px;cursor:pointer;border-radius:3px}
.unimgr-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:4px 6px}
.unimgr-del:hover{color:var(--red)}
.link-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:11px}
.link-row:last-child{border-bottom:none}
.link-row .link-txt{flex:1}
.link-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px}
.link-del:hover{color:var(--red)}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">⬡ Marvel Marathon</div>
    <div class="header-actions">
      <div class="segmented" id="pageSwitch">
        <button class="on" onclick="showPage('marathon')">📋 Marathon</button>
        <button onclick="showPage('timelines')">🕸 Timelines</button>
      </div>
      <button class="icon-btn" title="Réinitialiser mon marathon" onclick="resetMarathon()">↺</button>
      <button class="admin-btn" id="adminBtn" onclick="openLogin()">Visiteur</button>
    </div>
  </div>
  <div class="stats-bar" id="marathonStats">
    <div class="stat"><div class="stat-val" id="statSeen">0</div><div class="stat-lbl">Vus</div></div>
    <div class="stat"><div class="stat-val" id="statTotal">0</div><div class="stat-lbl">Total</div></div>
    <div class="stat"><div class="stat-val" id="statPct">0%</div><div class="stat-lbl">Complété</div></div>
  </div>
  <div class="progress-wrap" id="marathonProgressWrap"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
</div>

<div class="controls" id="marathonControls">
  <div class="controls-row">
    <input type="text" class="search" id="searchInput" placeholder="Rechercher..." oninput="render()">
    <div class="view-icons">
      <button class="icon-toggle on" title="Vue par studios" onclick="setView('studio',this)">☰</button>
      <button class="icon-toggle" title="Vue mosaïque" onclick="setView('mosaic',this)">▦</button>
    </div>
  </div>
  <div class="controls-row">
    <div class="segmented">
      <button class="on" id="scopeMineBtn" onclick="setScope('mine')">Mon marathon</button>
      <button id="scopeAllBtn" onclick="setScope('manage')">Gestion marathon</button>
    </div>
    <div class="filters" id="typeFilters"></div>
  </div>
  <div class="admin-row" id="adminRow" style="display:none">
    <span class="admin-label">Admin</span>
    <button class="add-btn" id="addBtn" onclick="openAddSearch()">+ Ajouter</button>
    <button class="add-btn" id="studioMgrBtn" onclick="openStudioMgr()">⚙ Studios</button>
  </div>
</div>

<div class="container" id="main"></div>

<!-- ═══════════ PAGE TIMELINES ═══════════ -->
<div class="controls" id="timelinesControls" style="display:none">
  <div class="segmented" id="sortToggle">
    <button class="on" onclick="setSort('chrono')">Chronologique</button>
    <button onclick="setSort('release')">Ordre de sortie</button>
  </div>
  <div class="segmented" id="tlFilterToggle">
    <button class="on" onclick="setTlFilter('all')">Tout le catalogue</button>
    <button onclick="setTlFilter('mine')">Mon marathon</button>
  </div>
  <div class="admin-tools" id="timelinesAdminTools" style="display:none">
    <button class="mini-btn" onclick="openUniverseMgr()">⚙ Univers</button>
    <button class="mini-btn" onclick="openLinkMgr()">🔗 Liens</button>
  </div>
</div>
<div class="board-wrap" id="boardWrap" style="display:none">
  <div class="board" id="board"></div>
</div>

<!-- Connexion admin -->
<div class="overlay" id="loginOverlay">
  <div class="modal">
    <div class="modal-title">Connexion admin</div>
    <div class="field"><label>Email</label><input type="email" id="loginEmail"></div>
    <div class="field"><label>Mot de passe</label><input type="password" id="loginPass"></div>
    <div id="loginError" style="color:var(--red);font-size:12px;margin-bottom:8px;display:none"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeOverlay('loginOverlay')">Annuler</button>
      <button class="btn btn-primary" onclick="doLogin()">Connexion</button>
    </div>
  </div>
</div>

<!-- Recherche TMDB pour ajout -->
<div class="overlay" id="addOverlay">
  <div class="modal">

<script>
// ═══════════════════════════════════════════════════════════════
// INIT FIREBASE
// ═══════════════════════════════════════════════════════════════
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();

const STUDIOS = {}; // rempli dynamiquement depuis Firestore, voir listenStudios()
let studios = []; // [{id, name, color}]

let catalog = [];      // depuis Firestore, collection 'catalog'
let progress = {};     // depuis Firestore, collection 'progress/{uid}/items'
let isAdmin = false;
let currentView = 'studio';
let currentDetailId = null;
let collapsed = {};

// ═══════════════════════════════════════════════════════════════
// AUTH — visiteurs = connexion anonyme automatique, invisible
// ═══════════════════════════════════════════════════════════════
auth.onAuthStateChanged(user => {
  if (!user) {
    auth.signInAnonymously().catch(err => console.error('Auth erreur', err));
    return;
  }
  isAdmin = user.uid === ADMIN_UID;
  document.getElementById('adminBtn').textContent = isAdmin ? '★ Admin' : 'Visiteur';
  document.getElementById('adminBtn').classList.toggle('active', isAdmin);
  document.getElementById('adminRow').style.display = isAdmin ? 'flex' : 'none';
  document.getElementById('timelinesAdminTools').style.display = isAdmin ? 'flex' : 'none';
  listenStudios();
  listenCatalog();
  listenProgress(user.uid);
  listenUniverses();
  listenLinks();
});

// ═══════════════════════════════════════════════════════════════
// NAVIGATION ENTRE PAGES (Marathon / Timelines)
// ═══════════════════════════════════════════════════════════════
let currentPage = 'marathon';
function showPage(page){
  currentPage = page;
  document.querySelectorAll('#pageSwitch button').forEach((b,i)=>b.classList.toggle('on', (i===0&&page==='marathon')||(i===1&&page==='timelines')));
  document.getElementById('marathonStats').style.display = page==='marathon' ? 'flex' : 'none';
  document.getElementById('marathonProgressWrap').style.display = page==='marathon' ? 'block' : 'none';
  document.getElementById('marathonControls').style.display = page==='marathon' ? 'flex' : 'none';
  document.getElementById('main').style.display = page==='marathon' ? '' : 'none';
  document.getElementById('timelinesControls').style.display = page==='timelines' ? 'flex' : 'none';
  document.getElementById('boardWrap').style.display = page==='timelines' ? 'block' : 'none';
  if (page === 'timelines') renderBoard();
}

// ═══════════════════════════════════════════════════════════════
// TIMELINES — état et réglages
// ═══════════════════════════════════════════════════════════════
let universes = [];
let links = [];
let sortMode = 'chrono'; // 'chrono' | 'release'
let tlFilterMode = 'all'; // 'all' | 'mine'

function listenUniverses(){
  db.collection('universes').orderBy('order').onSnapshot(snap => {
    universes = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    if (currentPage === 'timelines') renderBoard();
  });
}
function listenLinks(){
  db.collection('links').onSnapshot(snap => {
    links = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    if (currentPage === 'timelines') renderBoard();
  });
}

function setSort(mode){
  sortMode = mode;
  document.querySelectorAll('#sortToggle button').forEach((b,i)=>b.classList.toggle('on', (i===0&&mode==='chrono')||(i===1&&mode==='release')));
  renderBoard();
}
function setTlFilter(mode){
  tlFilterMode = mode;
  document.querySelectorAll('#tlFilterToggle button').forEach((b,i)=>b.classList.toggle('on', (i===0&&mode==='all')||(i===1&&mode==='mine')));
  renderBoard();
}

// ── Rendu de la frise ──
function renderBoard(){
  const board = document.getElementById('board');
  if (universes.length === 0){
    board.innerHTML = '<div class="empty-msg">Aucun univers créé pour l\'instant. Utilise "⚙ Univers" en admin pour commencer.</div>';
    removeLinksSvg();
    return;
  }
  let items = catalog.filter(d => d.universe);
  if (tlFilterMode === 'mine') items = items.filter(d => isIncluded(d.id));

  board.innerHTML = universes.map(u => {
    const uItems = items.filter(d => d.universe === u.id);
    const trunk = uItems.filter(d => !d.branch);
    const branchNames = [...new Set(uItems.filter(d => d.branch).map(d => d.branch))];
    const sortFn = sortMode === 'chrono'
      ? (a,b) => (a.chronoOrder ?? 9999) - (b.chronoOrder ?? 9999)
      : (a,b) => (a.releaseDate||'').localeCompare(b.releaseDate||'');
    trunk.sort(sortFn);
    return `
      <div class="uni-col" data-uni="${u.id}">
        <div class="uni-head" style="border-color:${u.color}">
          <div class="uni-dot" style="background:${u.color}"></div>
          <div class="uni-name">${u.name}</div>
        </div>
        <div class="uni-trunk">${trunk.map(tcardHtml).join('')}</div>
        ${branchNames.length ? `<div class="uni-branches">
          ${branchNames.map(bn => {
            const bItems = uItems.filter(d => d.branch === bn).sort(sortFn);
            return `<div class="uni-branch"><div class="branch-label">${bn}</div>${bItems.map(tcardHtml).join('')}</div>`;
          }).join('')}
        </div>` : ''}
      </div>`;
  }).join('');

  requestAnimationFrame(drawLinks);
}

function tcardHtml(d){
  const p = progress[d.id] || {};
  return `
    <div class="tcard ${p.watched?'watched':''}" data-card="${d.id}" onclick="openDetail('${d.id}')">
      ${isAdmin ? `<span class="tcard-assign" onclick="event.stopPropagation();openAssign('${d.id}')" title="Assigner">⚙</span>` : ''}
      <div class="tcard-check" onclick="event.stopPropagation();toggleWatchedFor('${d.id}')">${p.watched?'✓':''}</div>
      <div class="tcard-title">${d.title}</div>
      <div class="tcard-meta">${d.year||''} · ${d.type||''}</div>
    </div>`;
}

// ── Liens visuels entre cartes (SVG recalculé au resize/render) ──
function removeLinksSvg(){
  const old = document.getElementById('linksSvg');
  if (old) old.remove();
}
function drawLinks(){
  removeLinksSvg();
  if (links.length === 0 || currentPage !== 'timelines') return;
  const board = document.getElementById('board');
  const boardRect = board.getBoundingClientRect();
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('id','linksSvg');
  svg.classList.add('links-svg');
  svg.setAttribute('width', board.scrollWidth);
  svg.setAttribute('height', board.scrollHeight);
  let any = false;
  links.forEach(l => {
    const elA = board.querySelector(`[data-card="${l.a}"]`);
    const elB = board.querySelector(`[data-card="${l.b}"]`);
    if (!elA || !elB) return;
    any = true;
    const ra = elA.getBoundingClientRect(), rb = elB.getBoundingClientRect();
    const x1 = ra.left - boardRect.left + ra.width/2, y1 = ra.top - boardRect.top + ra.height/2;
    const x2 = rb.left - boardRect.left + rb.width/2, y2 = rb.top - boardRect.top + rb.height/2;
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    const mx = (x1+x2)/2;
    path.setAttribute('d', `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
    path.setAttribute('stroke', 'var(--gold)');
    path.setAttribute('stroke-width', '1.5');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-dasharray', '4 3');
    path.setAttribute('opacity', '0.55');
    svg.appendChild(path);
    if (l.label){
      const text = document.createElementNS('http://www.w3.org/2000/svg','text');
      text.setAttribute('x', mx);
      text.setAttribute('y', (y1+y2)/2 - 4);
      text.setAttribute('text-anchor','middle');
      text.setAttribute('class','link-label');
      text.textContent = l.label;
      svg.appendChild(text);
    }
  });
  if (any) board.appendChild(svg);
}
window.addEventListener('resize', () => { if (currentPage==='timelines') requestAnimationFrame(drawLinks); });

// ── Gestion des univers (admin) ──
function openUniverseMgr(){ renderUniverseMgr(); document.getElementById('universeMgrOverlay').classList.add('open'); }
function renderUniverseMgr(){
  const box = document.getElementById('universeMgrList');
  box.innerHTML = universes.map((u,i) => `
    <div class="unimgr-row">
      <div class="unimgr-order">
        <button onclick="moveUniverse('${u.id}',-1)" ${i===0?'disabled':''}>▲</button>
        <button onclick="moveUniverse('${u.id}',1)" ${i===universes.length-1?'disabled':''}>▼</button>
      </div>
      <input type="color" value="${u.color}" onchange="recolorUniverse('${u.id}', this.value)">
      <input type="text" value="${u.name}" onchange="renameUniverse('${u.id}', this.value)">
      <button class="unimgr-del" onclick="deleteUniverse('${u.id}','${u.name.replace(/'/g,"\\'")}')">🗑</button>
    </div>`).join('') || '<div class="empty-msg">Aucun univers.</div>';
}
function addUniverse(){
  const name = document.getElementById('newUniName').value.trim();
  const color = document.getElementById('newUniColor').value;
  if (!name) return;
  const order = universes.length;
  db.collection('universes').add({ name, color, order }).then(() => { document.getElementById('newUniName').value=''; });
}
function recolorUniverse(id, color){ db.collection('universes').doc(id).update({ color }); }
function renameUniverse(id, name){ name=name.trim(); if(name) db.collection('universes').doc(id).update({ name }); }
async function moveUniverse(id, dir){
  const idx = universes.findIndex(u => u.id === id);
  const swapIdx = idx + dir;
  if (swapIdx < 0 || swapIdx >= universes.length) return;
  const a = universes[idx], b = universes[swapIdx];
  const batch = db.batch();
  batch.update(db.collection('universes').doc(a.id), { order: b.order });
  batch.update(db.collection('universes').doc(b.id), { order: a.order });
  await batch.commit();
}
async function deleteUniverse(id, name){
  const affected = catalog.filter(d => d.universe === id);
  const msg = affected.length > 0
    ? `${affected.length} programme(s) sont dans "${name}" et perdront leur assignation. Continuer ?`
    : `Supprimer l'univers "${name}" ?`;
  if (!confirm(msg)) return;
  const batch = db.batch();
  affected.forEach(d => batch.update(db.collection('catalog').doc(d.id), { universe: firebase.firestore.FieldValue.delete(), chronoOrder: firebase.firestore.FieldValue.delete(), branch: firebase.firestore.FieldValue.delete() }));
  batch.delete(db.collection('universes').doc(id));
  await batch.commit();
}

// ── Assignation d'un programme ──
let assigningId = null;
function openAssign(id){
  assigningId = id;
  const d = catalog.find(x => x.id === id);
  if (!d) return;
  document.getElementById('assignTitle').textContent = d.title;
  document.getElementById('assignUniverse').innerHTML = '<option value="">— Aucun —</option>' + universes.map(u=>`<option value="${u.id}">${u.name}</option>`).join('');
  document.getElementById('assignUniverse').value = d.universe || '';
  document.getElementById('assignOrder').value = d.chronoOrder ?? '';
  document.getElementById('assignBranch').value = d.branch || '';
  document.getElementById('assignOverlay').classList.add('open');
}
function saveAssign(){
  if (!assigningId) return;
  const universe = document.getElementById('assignUniverse').value;
  const orderVal = document.getElementById('assignOrder').value;
  const branch = document.getElementById('assignBranch').value.trim();
  const update = {};
  update.universe = universe ? universe : firebase.firestore.FieldValue.delete();
  update.chronoOrder = orderVal !== '' ? Number(orderVal) : firebase.firestore.FieldValue.delete();
  update.branch = branch ? branch : firebase.firestore.FieldValue.delete();
  db.collection('catalog').doc(assigningId).update(update)
    .then(() => closeOverlay('assignOverlay'))
    .catch(err => alert('Erreur : ' + err.message));
}

// ── Créateur de liens ──
function openLinkMgr(){
  const opts = catalog.slice().sort((a,b)=>a.title.localeCompare(b.title)).map(d=>`<option value="${d.id}">${d.title}</option>`).join('');
  document.getElementById('linkA').innerHTML = opts;
  document.getElementById('linkB').innerHTML = opts;
  document.getElementById('linkLabel').value = '';
  renderLinkList();
  document.getElementById('linkMgrOverlay').classList.add('open');
}
function renderLinkList(){
  const box = document.getElementById('linkList');
  box.innerHTML = links.map(l => {
    const a = catalog.find(d=>d.id===l.a), b = catalog.find(d=>d.id===l.b);
    return `<div class="link-row">
      <span class="link-txt">${a?a.title:'?'} ↔ ${b?b.title:'?'}${l.label?' — '+l.label:''}</span>
      <button class="link-del" onclick="deleteLink('${l.id}')">🗑</button>
    </div>`;
  }).join('') || '<div class="empty-msg">Aucun lien.</div>';
}
function addLink(){
  const a = document.getElementById('linkA').value;
  const b = document.getElementById('linkB').value;
  const label = document.getElementById('linkLabel').value.trim();
  if (!a || !b || a === b) return alert('Choisis deux programmes différents.');
  db.collection('links').add({ a, b, label }).then(() => { document.getElementById('linkLabel').value=''; renderLinkList(); });
}
function deleteLink(id){
  if (!confirm('Supprimer ce lien ?')) return;
  db.collection('links').doc(id).delete();
}
function openAssignFromDetail(){
  if (!currentDetailId) return;
  closeOverlay('detailOverlay');
  openAssign(currentDetailId);
}

// ═══════════════════════════════════════════════════════════════
// FIRESTORE — studios (lecture publique, écriture admin only)
// ═══════════════════════════════════════════════════════════════
function listenStudios(){
  db.collection('studios').orderBy('name').onSnapshot(snap => {
    studios = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (studios.length === 0 && isAdmin) seedDefaultStudios();
    Object.keys(STUDIOS).forEach(k => delete STUDIOS[k]);
    studios.forEach(s => STUDIOS[s.name] = { color: s.color });
    renderStudioMgr();
    render();
  });
}

function seedDefaultStudios(){
  const defaults = [
    {name:'Marvel Studio', color:'#3A7BD5'}, {name:'Marvel Television', color:'#2ECC71'},
    {name:'Marvel Fox', color:'#E67E22'}, {name:'Marvel Sony', color:'#9B59B6'}, {name:'Autres', color:'#888888'}
  ];
  const batch = db.batch();
  defaults.forEach(s => batch.set(db.collection('studios').doc(), s));
  batch.commit().catch(err => console.error('Seed studios erreur', err));
}

function openStudioMgr(){
  renderStudioMgr();
  document.getElementById('studioMgrOverlay').classList.add('open');
}

function renderStudioMgr(){
  const box = document.getElementById('studioMgrList');
  if (!box) return;
  box.innerHTML = studios.map(s => `
    <div class="studiomgr-row">
      <input type="color" value="${s.color}" onchange="recolorStudio('${s.id}', this.value)">
      <input type="text" value="${s.name}" onchange="renameStudio('${s.id}', '${s.name.replace(/'/g,"\\'")}', this.value)">
      <button class="studiomgr-del" onclick="deleteStudio('${s.id}', '${s.name.replace(/'/g,"\\'")}')">🗑</button>
    </div>`).join('') || '<div class="empty-msg">Aucun studio pour l\'instant.</div>';
}

function addStudio(){
  const name = document.getElementById('newStudioName').value.trim();
  const color = document.getElementById('newStudioColor').value;
  if (!name) return;
  db.collection('studios').add({ name, color }).then(() => {
    document.getElementById('newStudioName').value = '';
  }).catch(err => alert('Erreur : ' + err.message));
}

function recolorStudio(id, color){
  db.collection('studios').doc(id).update({ color }).catch(err => alert('Erreur : ' + err.message));
}

async function renameStudio(id, oldName, newName){
  newName = newName.trim();
  if (!newName || newName === oldName) return;
  // Renomme le studio et met à jour tous les programmes qui y étaient rattachés
  const affected = await db.collection('catalog').where('studio', '==', oldName).get();
  const batch = db.batch();
  affected.docs.forEach(doc => batch.update(doc.ref, { studio: newName }));
  batch.update(db.collection('studios').doc(id), { name: newName });
  batch.commit().catch(err => alert('Erreur : ' + err.message));
}

async function deleteStudio(id, name){
  const affected = await db.collection('catalog').where('studio', '==', name).get();
  const msg = affected.size > 0
    ? `${affected.size} programme(s) sont dans ce studio et seront déplacés vers "Autres". Continuer ?`
    : `Supprimer le studio "${name}" ?`;
  if (!confirm(msg)) return;
  const batch = db.batch();
  affected.docs.forEach(doc => batch.update(doc.ref, { studio: 'Autres' }));
  batch.delete(db.collection('studios').doc(id));
  batch.commit().catch(err => alert('Erreur : ' + err.message));
}

function openLogin(){
  if (isAdmin) { auth.signOut(); return; }
  document.getElementById('loginOverlay').classList.add('open');
}
function doLogin(){
  const email = document.getElementById('loginEmail').value;
  const pass = document.getElementById('loginPass').value;
  auth.signInWithEmailAndPassword(email, pass)
    .then(() => closeOverlay('loginOverlay'))
    .catch(err => {
      const e = document.getElementById('loginError');
      e.textContent = "Identifiants incorrects.";
      e.style.display = 'block';
    });
}
function closeOverlay(id){ document.getElementById(id).classList.remove('open'); }

// ═══════════════════════════════════════════════════════════════
// FIRESTORE — catalogue partagé (lecture publique, écriture admin only,
// vérifié aussi côté serveur par les règles de sécurité)
// ═══════════════════════════════════════════════════════════════
function listenCatalog(){
  db.collection('catalog').orderBy('releaseDate').onSnapshot(snap => {
    catalog = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    buildFilters();
    render();
  }, err => console.error('Erreur lecture catalogue', err));
}

function listenProgress(uid){
  db.collection('progress').doc(uid).collection('items').onSnapshot(snap => {
    progress = {};
    snap.docs.forEach(d => progress[d.id] = d.data());
    render();
    refreshDetailIfOpen();
  });
}

function progressRef(catalogId){
  const uid = auth.currentUser.uid;
  return db.collection('progress').doc(uid).collection('items').doc(catalogId);
}

function toggleWatchedFor(catalogId){
  const cur = progress[catalogId] || {};
  progressRef(catalogId).set({ ...cur, watched: !cur.watched, watchDate: !cur.watched ? new Date().toISOString().slice(0,10) : (cur.watchDate||null) }, { merge:true });
}
function setRatingFor(catalogId, val){
  progressRef(catalogId).set({ rating: val }, { merge:true });
}

// ── Marquer tout un studio comme vu (épisode par épisode pour les séries) ──
function setProgramWatched(d, value){
  const cur = progress[d.id] || {};
  const update = { watched: value, watchDate: value ? (cur.watchDate || new Date().toISOString().slice(0,10)) : null };
  if (d.type === 'Série' && d.episodes){
    const watchedEpisodes = {};
    for (let i = 1; i <= d.episodes; i++) watchedEpisodes[i] = value;
    update.watchedEpisodes = watchedEpisodes;
  }
  return progressRef(d.id).set(update, { merge:true });
}

function markStudioWatched(studio, value){
  const items = catalog.filter(d => d.studio === studio && (currentScope !== 'mine' || isIncluded(d.id)));
  if (items.length === 0) return;
  if (!confirm(`Marquer les ${items.length} programme(s) de "${studio}" comme vus ?`)) return;
  Promise.all(items.map(d => setProgramWatched(d, value))).catch(err => alert('Erreur : ' + err.message));
}

// ── Réinitialiser tout le marathon perso (garde la sélection et les notes) ──
async function resetMarathon(){
  if (!auth.currentUser) return;
  if (!confirm('Remettre tous tes programmes en "non vu" pour repartir de zéro ?\n\nTa sélection de marathon et tes notes seront conservées.')) return;
  const uid = auth.currentUser.uid;
  try {
    const snap = await db.collection('progress').doc(uid).collection('items').get();
    const docs = snap.docs;
    for (let i = 0; i < docs.length; i += 400){
      const batch = db.batch();
      docs.slice(i, i+400).forEach(doc => {
        batch.set(doc.ref, { watched:false, watchDate:null, watchedEpisodes:{} }, { merge:true });
      });
      await batch.commit();
    }
    alert('Marathon réinitialisé !');
  } catch(err){
    alert('Erreur : ' + err.message);
  }
}

// ═══════════════════════════════════════════════════════════════
// TMDB — recherche pour l'ajout (admin only côté UI, la vraie
// protection est la règle Firestore côté serveur)
// ═══════════════════════════════════════════════════════════════
let tmdbDebounce = null;
function searchTMDB(query){
  clearTimeout(tmdbDebounce);
  const box = document.getElementById('tmdbResults');
  if (!query || query.length < 2) { box.innerHTML = ''; return; }
  tmdbDebounce = setTimeout(async () => {
    const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&language=fr-FR&query=${encodeURIComponent(query)}`);
    const json = await res.json();
    const items = (json.results||[]).filter(r => r.media_type === 'movie' || r.media_type === 'tv').slice(0,10);
    box.innerHTML = items.map(r => `
      <div class="tmdb-result" onclick='selectTMDBResult(${JSON.stringify(r).replace(/'/g,"&#39;")})'>
        <img src="${r.poster_path ? 'https://image.tmdb.org/t/p/w92'+r.poster_path : ''}">
        <div>
          <div class="tmdb-result-title">${r.title || r.name}</div>
          <div class="tmdb-result-meta">${r.media_type === 'movie' ? 'Film' : 'Série'} · ${(r.release_date||r.first_air_date||'').slice(0,4)}</div>
        </div>
      </div>`).join('') || '<div class="empty-msg">Aucun résultat</div>';
  }, 350);
}

function studioSelectOptions(){ return studios.map(s=>`<option>${s.name}</option>`).join(''); }

async function selectTMDBResult(r){
  const isMovie = r.media_type === 'movie';
  const detailRes = await fetch(`https://api.themoviedb.org/3/${isMovie?'movie':'tv'}/${r.id}?api_key=${TMDB_API_KEY}&language=fr-FR`);
  const detail = await detailRes.json();

  document.getElementById('addStep1').style.display = 'none';
  document.getElementById('addModalTitle').textContent = r.title || r.name;
  const step2 = document.getElementById('addStep2');
  step2.style.display = 'block';

  const studioSelectHtml = `
    <div class="field"><label>Studio</label>
      <select id="addStudioSelect">${studioSelectOptions()}</select>
    </div>`;

  if (isMovie){
    step2.innerHTML = `
      <span class="back-link" onclick="backToSearch()">‹ Retour à la recherche</span>
      ${studioSelectHtml}
      <div class="btn-row"><button class="btn btn-primary" style="flex:1" onclick='confirmAddMovie(${JSON.stringify(r).replace(/'/g,"&#39;")}, ${JSON.stringify(detail).replace(/'/g,"&#39;")})'>Ajouter ce film</button></div>`;
  } else {
    const seasons = (detail.seasons||[]).filter(s => s.season_number > 0);
    step2.innerHTML = `
      <span class="back-link" onclick="backToSearch()">‹ Retour à la recherche</span>
      ${studioSelectHtml}
      <div class="field"><label>Saisons à ajouter (une entrée par saison)</label></div>
      <div id="seasonList">${seasons.map(s => `
        <div class="season-row">
          <input type="checkbox" class="season-check" value="${s.season_number}" checked>
          <div>
            <div class="season-row-title">Saison ${s.season_number} — ${s.name}</div>
            <div class="season-row-meta">${s.episode_count} ép. · ${(s.air_date||'').slice(0,4)||'?'}</div>
          </div>
        </div>`).join('')}</div>
      <div class="btn-row"><button class="btn btn-primary" style="flex:1" onclick='confirmAddSeries(${JSON.stringify(r).replace(/'/g,"&#39;")})'>Ajouter les saisons cochées</button></div>`;
  }
}

function backToSearch(){
  document.getElementById('addStep1').style.display = 'block';
  document.getElementById('addStep2').style.display = 'none';
  document.getElementById('addModalTitle').textContent = 'Ajouter un programme';
}

function confirmAddMovie(r, detail){
  const studio = document.getElementById('addStudioSelect').value;
  const entry = {
    tmdbId: r.id, tmdbType: 'movie',
    title: r.title || r.name,
    overview: r.overview || '',
    type: 'Film', studio,
    year: (r.release_date||'').slice(0,4),
    releaseDate: r.release_date || '',
    duration: detail.runtime || 0,
    episodes: null,
    poster: r.poster_path ? 'https://image.tmdb.org/t/p/w342'+r.poster_path : '',
    addedAt: new Date().toISOString()
  };
  db.collection('catalog').add(entry)
    .then(() => closeOverlay('addOverlay'))
    .catch(err => alert('Erreur ajout (vérifie que tu es bien connecté en admin) : ' + err.message));
}

async function confirmAddSeries(r){
  const studio = document.getElementById('addStudioSelect').value;
  const checked = [...document.querySelectorAll('.season-check:checked')].map(c => c.value);
  for (const seasonNum of checked){
    const sRes = await fetch(`https://api.themoviedb.org/3/tv/${r.id}/season/${seasonNum}?api_key=${TMDB_API_KEY}&language=fr-FR`);
    const season = await sRes.json();
    const epRuntimes = (season.episodes||[]).map(e => e.runtime).filter(Boolean);
    const avgRuntime = epRuntimes.length ? Math.round(epRuntimes.reduce((a,b)=>a+b,0)/epRuntimes.length) : 0;
    const entry = {
      tmdbId: r.id, tmdbType: 'tv', tmdbSeason: Number(seasonNum),
      title: `${r.name} — Saison ${seasonNum}`,
      overview: season.overview || r.overview || '',
      type: 'Série', studio,
      year: (season.air_date||'').slice(0,4),
      releaseDate: season.air_date || '',
      duration: avgRuntime,
      episodes: (season.episodes||[]).length,
      poster: season.poster_path ? 'https://image.tmdb.org/t/p/w342'+season.poster_path : (r.poster_path ? 'https://image.tmdb.org/t/p/w342'+r.poster_path : ''),
      addedAt: new Date().toISOString()
    };
    await db.collection('catalog').add(entry).catch(err => alert('Erreur ajout saison '+seasonNum+' : ' + err.message));
  }
  closeOverlay('addOverlay');
}

function openAddSearch(){
  document.getElementById('tmdbSearchInput').value = '';
  document.getElementById('tmdbResults').innerHTML = '';
  backToSearch();
  document.getElementById('addOverlay').classList.add('open');
}

// ═══════════════════════════════════════════════════════════════
// FILTRES / RECHERCHE
// ═══════════════════════════════════════════════════════════════
let activeType = null;
function buildFilters(){
  const types = [...new Set(catalog.map(d => d.type))];
  const box = document.getElementById('typeFilters');
  box.innerHTML = types.map(t => `<button class="fbtn ${activeType===t?'on':''}" onclick="toggleTypeFilter('${t}')">${t}</button>`).join('');
}
function toggleTypeFilter(t){
  activeType = activeType === t ? null : t;
  buildFilters();
  render();
}

function filteredData(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  return catalog.filter(d => {
    if (activeType && d.type !== activeType) return false;
    if (q && !d.title.toLowerCase().includes(q)) return false;
    if (currentScope === 'mine' && !isIncluded(d.id)) return false;
    return true;
  });
}
// ═══════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════
function setView(v, btn){
  currentView = v;
  document.querySelectorAll('.view-icons .icon-toggle').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
  if (v === 'mosaic') scrollToFirstUnwatched();
}

function scrollToFirstUnwatched(){
  const list = filteredData();
  const idx = list.findIndex(d => !progress[d.id]?.watched);
  if (idx === -1) return;
  requestAnimationFrame(() => {
    const items = document.querySelectorAll('#main .mosaic-item');
    if (items[idx]) items[idx].scrollIntoView({ behavior:'smooth', block:'center' });
  });
}

let currentScope = 'mine'; // 'mine' = marathon perso, 'manage' = gestion de la sélection
function setScope(s){
  currentScope = s;
  document.getElementById('scopeMineBtn').classList.toggle('on', s==='mine');
  document.getElementById('scopeAllBtn').classList.toggle('on', s==='manage');
  render();
}

function isIncluded(id){
  const v = progress[id]?.included;
  return v === undefined ? true : v; // inclus par défaut
}
function toggleIncludedFor(id){
  const cur = progress[id] || {};
  progressRef(id).set({ included: !isIncluded(id) }, { merge:true });
}
function setStudioIncluded(studio, value){
  const items = catalog.filter(d => d.studio === studio);
  const batchPromises = items.map(d => progressRef(d.id).set({ included: value }, { merge:true }));
  Promise.all(batchPromises).catch(err => console.error(err));
}

function studioColor(s){ return (STUDIOS[s]||{color:'#888'}).color; }

function render(){
  updateStats();
  const list = filteredData();
  const main = document.getElementById('main');
  if (list.length === 0){
    main.innerHTML = `<div class="empty-msg">${catalog.length===0 ? "Le catalogue est vide pour l'instant." : (currentScope==='mine' ? "Ton marathon est vide — passe dans l'onglet \"Gestion marathon\" pour sélectionner des programmes." : "Aucun résultat.")}</div>`;
    return;
  }
  if (currentScope === 'manage'){
    const byStudio = {};
    list.forEach(d => { (byStudio[d.studio] = byStudio[d.studio]||[]).push(d); });
    main.innerHTML = Object.entries(byStudio).map(([studio, items]) => {
      const incCount = items.filter(d => isIncluded(d.id)).length;
      return `
        <div class="studio-section">
          <div class="studio-header" onclick="toggleCollapse('${studio}')">
            <div class="studio-dot" style="background:${studioColor(studio)}"></div>
            <div class="studio-name">${studio}</div>
            <div class="studio-prog">${incCount}/${items.length} sélectionnés</div>
            <div class="studio-actions" onclick="event.stopPropagation()">
              <button class="studio-mini-btn" onclick="setStudioIncluded('${studio}', true)">Tout inclure</button>
              <button class="studio-mini-btn" onclick="setStudioIncluded('${studio}', false)">Tout exclure</button>
            </div>
          </div>
          ${collapsed[studio] ? '' : `<div class="grid">${items.map(cardManage).join('')}</div>`}
        </div>`;
    }).join('');
  } else if (currentView === 'mosaic'){
    main.innerHTML = `<div class="mosaic-grid">${list.map(cardMosaic).join('')}</div>`;
  } else {
    const byStudio = {};
    list.forEach(d => { (byStudio[d.studio] = byStudio[d.studio]||[]).push(d); });
    main.innerHTML = Object.entries(byStudio).map(([studio, items]) => {
      const seen = items.filter(d => progress[d.id]?.watched).length;
      const pct = Math.round(seen/items.length*100);
      return `
        <div class="studio-section">
          <div class="studio-header" onclick="toggleCollapse('${studio}')">
            <div class="studio-dot" style="background:${studioColor(studio)}"></div>
            <div class="studio-name">${studio}</div>
            <div class="studio-prog">${seen}/${items.length} · ${pct}%</div>
            <div class="studio-actions" onclick="event.stopPropagation()">
              <button class="studio-mini-btn" onclick='markStudioWatched("${studio}", true)'>Tout marquer vu</button>
            </div>
          </div>
          <div class="studio-bar"><div class="studio-bar-fill" style="width:${pct}%;background:${studioColor(studio)}"></div></div>
          ${collapsed[studio] ? '' : `<div class="grid">${items.map(cardItem).join('')}</div>`}
        </div>`;
    }).join('');
  }
}

function toggleCollapse(s){ collapsed[s] = !collapsed[s]; render(); }

function cardItem(d){
  const p = progress[d.id] || {};
  const stars = [1,2,3,4,5].map(n => `<span class="star ${p.rating>=n?'lit':''}" onclick="event.stopPropagation();setRatingFor('${d.id}',${n})">★</span>`).join('');
  return `
    <div class="card ${p.watched?'watched':''}" onclick="openDetail('${d.id}')">
      <div class="card-check" onclick="event.stopPropagation();toggleWatchedFor('${d.id}')">${p.watched?'✓':''}</div>
      <div class="card-studio">${d.type}</div>
      <div class="card-title">${d.title}</div>
      <div class="card-meta">${d.year || ''} ${d.duration ? '· '+fmtDuration(d.duration, d.episodes) : ''}</div>
      <div class="card-stars">${stars}</div>
    </div>`;
}

function cardMosaic(d){
  const p = progress[d.id] || {};
  return `
    <div class="mosaic-item ${p.watched?'watched':''}" onclick="openDetail('${d.id}')">
      ${d.poster ? `<img src="${d.poster}">` : `<div class="mosaic-item-ph">${d.title}</div>`}
      ${p.watched ? '<div class="mosaic-check">✓</div>' : ''}
    </div>`;
}

function cardManage(d){
  const inc = isIncluded(d.id);
  return `
    <div class="card manage-card" onclick="toggleIncludedFor('${d.id}')">
      <input type="checkbox" class="manage-checkbox" ${inc?'checked':''} onclick="event.stopPropagation();toggleIncludedFor('${d.id}')">
      <div class="card-studio">${d.type}</div>
      <div class="card-title" style="padding-right:0">${d.title}</div>
      <div class="card-meta">${d.year || ''} ${d.duration ? '· '+fmtDuration(d.duration, d.episodes) : ''}</div>
    </div>`;
}

function fmtDuration(min, episodes){
  if (episodes) return `${episodes} ép.`;
  const h = Math.floor(min/60), m = min%60;
  return h ? `${h}h${m.toString().padStart(2,'0')}` : `${m}min`;
}

function updateStats(){
  const mine = catalog.filter(d => isIncluded(d.id));
  const total = mine.length;
  const seen = mine.filter(d => progress[d.id]?.watched).length;
  document.getElementById('statSeen').textContent = seen;
  document.getElementById('statTotal').textContent = total;
  const pct = total ? Math.round(seen/total*100) : 0;
  document.getElementById('statPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

// FICHE DÉTAIL
// ═══════════════════════════════════════════════════════════════
let lastEpisodesCache = null; // {catalogId, episodes}

async function openDetail(id){
  const d = catalog.find(x => x.id === id);
  if (!d) return;
  currentDetailId = id;
  lastEpisodesCache = null;
  const p = progress[id] || {};

  document.getElementById('detailPoster').src = d.poster || '';
  document.getElementById('detailTitle').textContent = d.title;
  document.getElementById('detailBadges').innerHTML = `
    <span class="detail-badge" style="background:${studioColor(d.studio)}33;color:${studioColor(d.studio)}">${d.studio}</span>
    <span class="detail-badge" style="background:var(--bg3);color:var(--muted)">${d.type}</span>
    <span class="detail-badge" style="background:var(--bg3);color:var(--muted)">${d.year||''}${d.duration?' · '+fmtDuration(d.duration,d.episodes):''}</span>`;
  document.getElementById('detailStars').innerHTML = [1,2,3,4,5].map(n => `<span class="star ${p.rating>=n?'lit':''}" onclick="setRatingFor('${id}',${n});refreshDetailRating()">★</span>`).join('');
  document.getElementById('detailAdminDelete').style.display = isAdmin ? 'inline-block' : 'none';
  document.getElementById('detailAdminEdit').style.display = isAdmin ? 'inline-block' : 'none';
  document.getElementById('detailAdminAssign').style.display = isAdmin ? 'inline-block' : 'none';
  updateDetailNavButtons();

  const wBtn = document.getElementById('detailWatchBtn');
  const epBox = document.getElementById('detailEpisodes');
  const isSeries = d.type === 'Série' && d.tmdbId && d.tmdbSeason;

  if (isSeries){
    wBtn.style.display = 'none';
    epBox.style.display = 'block';
    epBox.innerHTML = '<div class="empty-msg" style="padding:1.5rem 0">Chargement des épisodes…</div>';
    document.getElementById('detailOverlay').classList.add('open');
    try {
      const res = await fetch(`https://api.themoviedb.org/3/tv/${d.tmdbId}/season/${d.tmdbSeason}?api_key=${TMDB_API_KEY}&language=fr-FR`);
      const season = await res.json();
      const episodes = season.episodes || [];
      lastEpisodesCache = { catalogId: id, episodes };
      renderEpisodeChecklist(id, episodes);
    } catch(e){
      epBox.innerHTML = '<div class="empty-msg" style="padding:1.5rem 0">Impossible de charger les épisodes.</div>';
    }
  } else {
    epBox.style.display = 'none';
    wBtn.style.display = 'inline-block';
    wBtn.textContent = p.watched ? '✓ Vu' : 'Marquer comme vu';
    document.getElementById('detailOverlay').classList.add('open');
  }
}

function refreshDetailRating(){
  if (!currentDetailId) return;
  const p = progress[currentDetailId] || {};
  document.getElementById('detailStars').innerHTML = [1,2,3,4,5].map(n => `<span class="star ${p.rating>=n?'lit':''}" onclick="setRatingFor('${currentDetailId}',${n});refreshDetailRating()">★</span>`).join('');
}

// ── Navigation swipe / flèches entre fiches (respecte les filtres/vue en cours) ──
function detailNav(dir){
  const list = filteredData();
  const idx = list.findIndex(d => d.id === currentDetailId);
  if (idx === -1) return;
  const nextIdx = idx + dir;
  if (nextIdx < 0 || nextIdx >= list.length) return;
  openDetail(list[nextIdx].id);
}

function updateDetailNavButtons(){
  const list = filteredData();
  const idx = list.findIndex(d => d.id === currentDetailId);
  document.getElementById('detailPrevBtn').disabled = idx <= 0;
  document.getElementById('detailNextBtn').disabled = idx === -1 || idx >= list.length - 1;
}

(function initDetailSwipe(){
  const modal = document.getElementById('detailModal');
  let startX = 0, startY = 0, tracking = false;
  modal.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, { passive:true });
  modal.addEventListener('touchend', e => {
    if (!tracking) return;
    tracking = false;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){
      detailNav(dx < 0 ? 1 : -1);
    }
  }, { passive:true });
})();

document.addEventListener('keydown', e => {
  if (!document.getElementById('detailOverlay').classList.contains('open')) return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); detailNav(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); detailNav(1); }
  else if (e.key === 'Escape') { closeOverlay('detailOverlay'); }
});

function renderEpisodeChecklist(catalogId, episodes){
  const p = progress[catalogId] || {};
  const watchedMap = p.watchedEpisodes || {};
  const total = episodes.length;
  const done = episodes.filter(e => watchedMap[e.episode_number]).length;
  const pct = total ? Math.round(done/total*100) : 0;
  const epNums = episodes.map(e => e.episode_number);
  document.getElementById('detailEpisodes').innerHTML = `
    <div class="ep-header">
      <span class="ep-header-count">${done}/${total} épisodes vus</span>
      <div class="ep-actions">
        <button class="studio-mini-btn" onclick='toggleAllEpisodes("${catalogId}", ${JSON.stringify(epNums)}, true)'>Tout cocher</button>
        <button class="studio-mini-btn" onclick='toggleAllEpisodes("${catalogId}", ${JSON.stringify(epNums)}, false)'>Tout décocher</button>
      </div>
    </div>
    <div class="ep-progress-wrap"><div class="ep-progress-fill" style="width:${pct}%"></div></div>
    <div class="ep-list">
      ${episodes.map(e => `
        <label class="ep-row">
          <input type="checkbox" ${watchedMap[e.episode_number]?'checked':''} onchange="toggleEpisodeFor('${catalogId}', ${e.episode_number}, ${total})">
          <span class="ep-num">E${e.episode_number}</span>
          <span class="ep-title">${(e.name||'').replace(/</g,'&lt;')}</span>
        </label>`).join('')}
    </div>`;
}

function toggleEpisodeFor(catalogId, epNum, total){
  const cur = progress[catalogId] || {};
  const watchedEpisodes = { ...(cur.watchedEpisodes||{}) };
  watchedEpisodes[epNum] = !watchedEpisodes[epNum];
  const done = Object.values(watchedEpisodes).filter(Boolean).length;
  progressRef(catalogId).set({
    watchedEpisodes,
    watched: done >= total,
    watchDate: done >= total ? (cur.watchDate || new Date().toISOString().slice(0,10)) : (cur.watchDate || null)
  }, { merge:true }).catch(err => alert('Erreur : ' + err.message));
}

function toggleAllEpisodes(catalogId, epNums, value){
  const cur = progress[catalogId] || {};
  const watchedEpisodes = { ...(cur.watchedEpisodes||{}) };
  epNums.forEach(n => watchedEpisodes[n] = value);
  const total = epNums.length;
  const done = Object.values(watchedEpisodes).filter(Boolean).length;
  progressRef(catalogId).set({
    watchedEpisodes,
    watched: done >= total,
    watchDate: value ? (cur.watchDate || new Date().toISOString().slice(0,10)) : (cur.watchDate || null)
  }, { merge:true }).catch(err => alert('Erreur : ' + err.message));
}

function refreshDetailIfOpen(){
  if (!document.getElementById('detailOverlay').classList.contains('open')) return;
  if (!currentDetailId) return;
  const d = catalog.find(x => x.id === currentDetailId);
  if (!d) return;
  const p = progress[currentDetailId] || {};
  if (lastEpisodesCache && lastEpisodesCache.catalogId === currentDetailId){
    renderEpisodeChecklist(currentDetailId, lastEpisodesCache.episodes);
  } else if (document.getElementById('detailWatchBtn').style.display !== 'none') {
    document.getElementById('detailWatchBtn').textContent = p.watched ? '✓ Vu' : 'Marquer comme vu';
  }
  refreshDetailRating();
  updateDetailNavButtons();
}

function toggleWatched(){
  if (!currentDetailId) return;
  toggleWatchedFor(currentDetailId);
  const p = progress[currentDetailId] || {};
  document.getElementById('detailWatchBtn').textContent = !p.watched ? '✓ Vu' : 'Marquer comme vu';
}

render();
</script>
</body></html>
