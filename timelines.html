<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#E23636;--gold:#C9973A;--bg:#111;--bg2:#1a1a1a;--bg3:#222;--border:#333;--text:#eee;--muted:#888}
html.light{--bg:#ffffff;--bg2:#f2f2f4;--bg3:#e9e9ec;--border:#ddd;--text:#111;--muted:#666}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;min-height:100dvh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:calc(.6rem + env(safe-area-inset-top)) 1rem .6rem;position:sticky;top:0;z-index:60}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.logo{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:1.5px;color:var(--red);display:flex;align-items:center;gap:6px;white-space:nowrap}
.nav-link{background:var(--bg3);border:1px solid var(--border);color:var(--muted);font-size:10px;padding:5px 10px;border-radius:12px;white-space:nowrap}
.nav-link:hover{border-color:var(--gold);color:var(--gold)}
.header-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.admin-btn{background:var(--bg3);border:1px solid var(--border);color:var(--muted);font-size:10px;padding:5px 10px;border-radius:12px;cursor:pointer;white-space:nowrap}
.icon-btn{width:28px;height:28px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;flex-shrink:0}
.admin-btn.active{border-color:var(--gold);color:var(--gold)}

.controls{background:var(--bg2);border-bottom:1px solid var(--border);padding:.6rem 1rem;position:sticky;top:52px;z-index:55;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.segmented{display:flex;background:var(--bg3);border-radius:16px;padding:2px;gap:2px}
.segmented button{border:none;background:transparent;color:var(--muted);font-size:11px;padding:6px 12px;border-radius:14px;cursor:pointer;white-space:nowrap}
.segmented button.on{background:var(--red);color:#fff}
.admin-tools{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.mini-btn{padding:5px 12px;border-radius:14px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:11px;cursor:pointer;font-weight:600;white-space:nowrap}

.board-wrap{overflow:auto;padding:20px 16px 40px;position:relative;height:calc(100dvh - var(--wrap-top, 140px))}
.board{display:grid;grid-auto-flow:row;column-gap:20px;row-gap:10px;position:relative;grid-template-columns:44px repeat(var(--n-uni,1), 200px)}
@media (min-width:900px){
  .board{grid-template-columns:44px repeat(var(--n-uni,1), 1fr)}
}
.year-label{grid-column:1;display:flex;align-items:flex-start;justify-content:center;padding-top:2px;font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--muted);border-right:1px solid var(--border);position:sticky;top:0;z-index:15}
.col-bg{border-radius:10px;pointer-events:none;margin:-6px -6px 0}
.uni-head{grid-row:1;display:flex;align-items:center;gap:8px;padding-bottom:8px;padding-top:8px;border-bottom:2px solid;position:sticky;top:0;z-index:20;background:var(--bg)}
.uni-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.uni-name{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.5px}
.branch-head{grid-row:1;display:flex;align-items:flex-end;gap:4px;padding-bottom:8px;padding-top:8px;border-bottom:1px dashed;position:sticky;top:0;z-index:20;background:var(--bg)}
.branch-head-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;line-height:1.2}


.mobile-tabs{display:none}
.mobile-list{display:none}
@media (max-width:899px){
  .board-wrap{display:none}
  .mobile-tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30;-webkit-overflow-scrolling:touch}
  .mobile-list{display:block;padding:14px 16px 40px}
}
.mtab{padding:6px 13px;border-radius:14px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:600;white-space:nowrap;cursor:pointer;flex-shrink:0}
.myear{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--muted);letter-spacing:.5px;margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.myear:first-child{margin-top:0}
.mlist-item{margin-bottom:10px}
.mlink-badge{margin-top:6px;font-size:10px;padding:5px 9px;border-radius:8px;background:var(--bg3);color:var(--gold);display:flex;align-items:center;gap:5px;cursor:pointer;font-weight:500}
#detailLinks{margin:6px 0 12px}
.mlink-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

.tcard{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px;cursor:pointer;position:relative;font-size:11px}
.tcard.watched{border-left:3px solid var(--uc, var(--red))}
.tcard-title{font-weight:500;line-height:1.3;margin-bottom:2px;padding-right:16px}
.tcard.has-assign .tcard-title{padding-left:16px}
.tcard-meta{font-size:9px;color:var(--muted)}
.tcard-check{position:absolute;top:6px;right:6px;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:8px}
.tcard.watched .tcard-check{background:var(--uc, var(--red));border-color:var(--uc, var(--red));color:#fff}
.tcard-time-badge{position:absolute;bottom:-6px;right:-6px;font-size:11px}
.tcard-assign{position:absolute;top:6px;left:6px;font-size:11px;color:var(--gold);opacity:.85}

svg.links-svg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
.link-label{fill:var(--muted);font-size:9px}

.empty-msg{text-align:center;color:var(--muted);padding:3rem 1rem;font-size:13px}

/* Overlays / modals (mêmes styles que index.html) */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:calc(1rem + env(safe-area-inset-top)) 1rem calc(1rem + env(safe-area-inset-bottom));overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:1.5rem;width:100%;max-width:420px;margin:0 auto}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;color:var(--red);margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.field input,.field select{width:100%;padding:8px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px;font-family:inherit}
.btn-row{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;padding:10px;border-radius:8px;border:none;font-size:13px;font-weight:500;cursor:pointer}
.btn-primary{background:var(--red);color:#fff}
.btn-secondary{background:var(--bg3);border:1px solid var(--border);color:var(--muted)}
.close-x{position:absolute;top:10px;right:10px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;cursor:pointer;background:rgba(0,0,0,.5);border:none;border-radius:50%}
.detail-nav{position:absolute;top:150px;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;border:none;z-index:2}
.detail-nav:disabled{opacity:.25;cursor:default}
.detail-nav.prev{left:10px}
.detail-nav.next{right:10px}

.unimgr-row{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.unimgr-row:last-child{border-bottom:none}
.unimgr-row input[type=color]{width:30px;height:30px;border:none;background:none;padding:0;flex-shrink:0;cursor:pointer}
.unimgr-row input[type=text]{flex:1;padding:6px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px}
.unimgr-order{display:flex;flex-direction:column;gap:2px}
.unimgr-order button{background:none;border:1px solid var(--border);color:var(--muted);width:20px;height:16px;font-size:9px;cursor:pointer;border-radius:3px}
.unimgr-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:4px 6px}
.unimgr-del:hover{color:var(--red)}

.link-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:11px}
.link-row:last-child{border-bottom:none}
.link-row .link-txt{flex:1}
.link-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px}
.link-del:hover{color:var(--red)}
.bulk-row{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--border);font-size:12px}
.bulk-row:last-child{border-bottom:none}
.bulk-row input[type=checkbox]{width:16px;height:16px;flex-shrink:0;accent-color:var(--gold);cursor:pointer}
.bulk-list{max-height:340px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:0 8px;margin-top:8px}
.bulk-search{width:100%;padding:8px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px;margin-bottom:8px}
.bulk-actions{display:flex;gap:6px;margin-bottom:4px}
.bulk-mini-btn{font-size:10px;padding:3px 9px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer}
.placement-row{display:flex;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.placement-row:last-child{border-bottom:none}
.placement-row select{flex:1;min-width:100px;padding:6px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11px}
.placement-row input[type=text]{width:90px;padding:6px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11px}
.placement-row input[type=text].pdate{width:100px}
.placement-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px}
.placement-del:hover{color:var(--red)}

.detail-poster{max-width:100%;width:auto;max-height:340px;height:auto;border-radius:10px;margin:0 auto 12px;display:block}
.detail-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1px;margin-bottom:6px}
.detail-meta{font-size:11px;color:var(--muted);margin-bottom:14px}
</style>

<body>

<div class="header">
  <div class="header-top">
    <div class="logo">🕸 Marvel Timelines</div>
    <div class="header-actions">
      <a class="nav-link" href="index.html?v=20260823">📋 Marathon</a>
      <button class="icon-btn" id="themeBtn" title="Changer de thème" onclick="toggleTheme()">🌙</button>
      <button class="admin-btn" id="adminBtn" onclick="openLogin()">Visiteur</button>
    </div>
  </div>
</div>

<div class="controls">
  <div class="segmented" id="sortToggle">
    <button class="on" onclick="setSort('release')">Ordre de sortie</button>
    <button onclick="setSort('chrono')">Chronologique</button>
  </div>
  <div class="segmented" id="filterToggle">
    <button class="on" onclick="setFilter('all')">Tout le catalogue</button>
    <button onclick="setFilter('mine')">Mon marathon</button>
  </div>
  <button class="mini-btn" id="exportPdfBtn" onclick="exportTimelinePNG()" title="Télécharge deux PNG haute résolution (fond sombre + fond clair)">🖼 Exporter en PNG</button>
  <div class="admin-tools" id="adminTools" style="display:none">
    <button class="mini-btn" onclick="openUniverseMgr()">⚙ Univers</button>
    <button class="mini-btn" id="bulkAssignBtn" onclick="openBulkAssignPicker()">📌 Affecter des programmes</button>
    <button class="mini-btn" onclick="openLinkMgr()">🔗 Liens</button>
  </div>
</div>

<div class="board-wrap" id="boardWrap">
  <div class="board" id="board"></div>
</div>

<div class="mobile-tabs" id="mobileTabs"></div>
<div class="mobile-list" id="mobileList"></div>

<!-- Connexion admin -->
<div class="overlay" id="loginOverlay">
  <div class="modal">
    <div class="segmented" style="margin-bottom:14px">
      <button class="on" id="loginTabSignin" onclick="setLoginTab('signin')">Se connecter</button>
      <button id="loginTabSignup" onclick="setLoginTab('signup')">Créer un compte</button>
    </div>
    <div class="field"><label>Email</label><input type="email" id="loginEmail"></div>
    <div class="field" id="loginNameField" style="display:none"><label>Pseudo (affiché aux autres)</label><input type="text" id="loginName" placeholder="ex: Erwan"></div>
    <div class="field"><label>Mot de passe</label><input type="password" id="loginPass"></div>
    <div id="loginError" style="color:var(--red);font-size:12px;margin-bottom:8px;display:none"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeOverlay('loginOverlay')">Annuler</button>
      <button class="btn btn-primary" id="loginSubmitBtn" onclick="doLogin()">Connexion</button>
    </div>
  </div>
</div>

<!-- Gestion des univers -->
<div class="overlay" id="universeMgrOverlay">
  <div class="modal">
    <div class="modal-title" id="universeMgrTitle">Gérer les univers</div>
    <div id="universeMgrList"></div>
    <div class="field" style="margin-top:14px">
      <label>Nouvel univers</label>
      <div style="display:flex;gap:8px">
        <input type="color" id="newUniColor" value="#3A7BD5" style="width:40px;padding:2px;height:34px">
        <input type="text" id="newUniName" placeholder="Nom de l'univers" style="flex:1;padding:8px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeOverlay('universeMgrOverlay')">Fermer</button>
      <button class="btn btn-primary" onclick="addUniverse()">Ajouter</button>
    </div>
  </div>
</div>

<!-- Assignation d'un programme -->
<div class="overlay" id="assignOverlay">
  <div class="modal">
    <div class="modal-title" id="assignTitle">Assigner</div>

    <div style="font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Ordre de sortie</div>
    <div class="field"><label>Univers</label><select id="assignUniverse"></select></div>
    <div class="field"><label>Branche (optionnel — laisser vide si tronc commun)</label><input type="text" id="assignBranch" placeholder="ex: Branche originale"></div>

    <div style="font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px;padding-top:14px;border-top:1px dashed var(--border)">Placements chronologiques</div>
    <div id="placementList"></div>
    <button class="bulk-mini-btn" style="margin-top:6px" onclick="addPlacementRow()">+ Ajouter un placement</button>

    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeOverlay('assignOverlay')">Annuler</button>
      <button class="btn btn-primary" onclick="saveAssign()">Enregistrer</button>
    </div>
  </div>
</div>

<!-- Créateur de liens -->
<div class="overlay" id="linkMgrOverlay">
  <div class="modal">
    <div class="modal-title" id="linkMgrTitle">Liens entre programmes</div>
    <div class="field" id="linkCategoryField"><label>Catégorie</label>
      <select id="linkCategory" onchange="onLinkCategoryChange()">
        <option value="multiverse">🌀 Rencontre multiversielle</option>
        <option value="timetravel">🕐 Voyage dans le temps</option>
      </select>
    </div>
    <div class="field"><label>Programme A</label><select id="linkA" onchange="onLinkProgramChange()"></select></div>
    <div class="field" id="linkAPlacementField" style="display:none"><label>Époque de A</label><select id="linkAPlacement"></select></div>
    <div class="field"><label>Programme B</label><select id="linkB" onchange="onLinkProgramChange()"></select></div>
    <div class="field" id="linkBPlacementField" style="display:none"><label>Époque de B</label><select id="linkBPlacement"></select></div>
    <div class="field"><label>Type de relation</label>
      <select id="linkType">
        <option value="sequel">B est la suite directe de A (flèche pleine)</option>
        <option value="reference">Simple référence croisée (pointillé)</option>
      </select>
    </div>
    <div class="field"><label>Texte (optionnel)</label><input type="text" id="linkLabel" placeholder="ex: Apparition croisée"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeOverlay('linkMgrOverlay')">Fermer</button>
      <button class="btn btn-primary" onclick="addLink()">Créer le lien</button>
    </div>
    <div style="margin-top:16px">
      <label style="display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Liens existants</label>
      <div id="linkList"></div>
    </div>
  </div>
</div>

<!-- Assignation en masse -->
<div class="overlay" id="bulkAssignOverlay">
  <div class="modal">
    <div class="modal-title">Affecter des programmes</div>
    <div class="field"><label>Univers cible</label><select id="bulkUniverseSelect" onchange="onBulkUniverseChange()"></select></div>
    <input type="text" class="bulk-search" id="bulkSearch" placeholder="Rechercher..." oninput="renderBulkList()">
    <div class="bulk-actions">
      <button class="bulk-mini-btn" onclick="bulkCheckAll(true)">Tout cocher</button>
      <button class="bulk-mini-btn" onclick="bulkCheckAll(false)">Tout décocher</button>
    </div>
    <div class="bulk-list" id="bulkList"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeOverlay('bulkAssignOverlay')">Fermer</button>
      <button class="btn btn-primary" onclick="confirmBulkAssign()">Ajouter la sélection</button>
    </div>
  </div>
</div>

<!-- Fiche programme (simplifiée) -->
<div class="overlay" id="detailOverlay">
  <div class="modal" id="detailModal" style="position:relative">
    <button class="close-x" onclick="closeOverlay('detailOverlay')">✕</button>
    <button class="detail-nav prev" id="detailPrevBtn" onclick="detailNav(-1)">‹</button>
    <button class="detail-nav next" id="detailNextBtn" onclick="detailNav(1)">›</button>
    <img class="detail-poster" id="detailPoster">
    <div class="detail-title" id="detailTitle"></div>
    <div class="detail-meta" id="detailMeta"></div>
    <div id="detailLinks"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="detailWatchBtn" onclick="toggleDetailWatched()"></button>
      <button class="btn btn-secondary" id="detailAssignBtn" style="display:none" onclick="openAssignFromDetail()">Assigner</button>
    </div>
  </div>
</div>

<script>
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();

let catalog = [];
let universes = [];        // univers pour le mode "Ordre de sortie"
let chronoUniverses = [];  // univers pour le mode "Chronologique" — collection indépendante
let links = [];            // liens pour le mode "Ordre de sortie"
let chronoLinks = [];      // liens pour le mode "Chronologique" — collection indépendante
let progress = {};
let isAdmin = false;
let filterMode = 'all'; // 'all' | 'mine'
let currentDetailId = null;
let currentDetailPlacementId = null;
let navNextOf = {}, navPrevOf = {};

auth.onAuthStateChanged(user => {
  if (!user) { auth.signInAnonymously().catch(console.error); return; }
  isAdmin = user.uid === ADMIN_UID;
  document.getElementById('adminBtn').classList.toggle('active', isAdmin);
  document.getElementById('adminTools').style.display = isAdmin ? 'flex' : 'none';
  if (isAdmin){
    document.getElementById('adminBtn').textContent = '★ Admin';
  } else if (!user.isAnonymous){
    document.getElementById('adminBtn').textContent = 'Connecté';
    db.collection('progress').doc(user.uid).get().then(doc => {
      const name = doc.exists ? doc.data().displayName : null;
      if (name) document.getElementById('adminBtn').textContent = name;
    }).catch(() => {});
  } else {
    document.getElementById('adminBtn').textContent = 'Visiteur';
  }
  listenCatalog();
  listenUniverses();
  listenChronoUniverses();
  listenLinks();
  listenChronoLinks();
  listenProgress(user.uid);
});

let loginMode = 'signin';
function setLoginTab(mode){
  loginMode = mode;
  document.getElementById('loginTabSignin').classList.toggle('on', mode==='signin');
  document.getElementById('loginTabSignup').classList.toggle('on', mode==='signup');
  document.getElementById('loginNameField').style.display = mode==='signup' ? 'block' : 'none';
  document.getElementById('loginSubmitBtn').textContent = mode==='signup' ? 'Créer le compte' : 'Connexion';
  document.getElementById('loginError').style.display = 'none';
}
function openLogin(){
  if (isAdmin || (auth.currentUser && !auth.currentUser.isAnonymous)) { auth.signOut(); return; }
  setLoginTab('signin');
  document.getElementById('loginOverlay').classList.add('open');
}
function doLogin(){
  const email = document.getElementById('loginEmail').value;
  const pass = document.getElementById('loginPass').value;
  const e = document.getElementById('loginError');
  e.style.display = 'none';

  if (loginMode === 'signup'){
    const name = document.getElementById('loginName').value.trim();
    if (!name) { e.textContent = 'Choisis un pseudo.'; e.style.display = 'block'; return; }
    const credential = firebase.auth.EmailAuthProvider.credential(email, pass);
    const current = auth.currentUser;
    const finish = (user) => {
      db.collection('progress').doc(user.uid).set({ displayName: name }, { merge:true })
        .then(() => closeOverlay('loginOverlay'))
        .catch(() => closeOverlay('loginOverlay'));
    };
    if (current && current.isAnonymous){
      current.linkWithCredential(credential)
        .then(res => finish(res.user))
        .catch(err => {
          e.textContent = err.code === 'auth/email-already-in-use'
            ? 'Un compte existe déjà avec cet email — connecte-toi plutôt.'
            : "Erreur : " + err.message;
          e.style.display = 'block';
        });
    } else {
      auth.createUserWithEmailAndPassword(email, pass)
        .then(res => finish(res.user))
        .catch(err => { e.textContent = "Erreur : " + err.message; e.style.display = 'block'; });
    }
    return;
  }

  auth.signInWithEmailAndPassword(email, pass)
    .then(() => closeOverlay('loginOverlay'))
    .catch(() => { e.textContent='Identifiants incorrects.'; e.style.display='block'; });
}

// ── Rendu de la frise ──
function fmtYear(d){ return d.year || (d.releaseDate||'').slice(0,4) || ''; }
function hexToRgba(hex, alpha){
  hex = (hex||'#888888').replace('#','');
  if (hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
  const r = parseInt(hex.substring(0,2),16) || 0;
  const g = parseInt(hex.substring(2,4),16) || 0;
  const b = parseInt(hex.substring(4,6),16) || 0;
  return `rgba(${r},${g},${b},${alpha})`;
}
function parseStoryDate(s){
  const parts = (s||'').split('-');
  return { year: parseInt(parts[0],10)||0, month: parts[1]?parseInt(parts[1],10):null, day: parts[2]?parseInt(parts[2],10):null };
}
// Compare deux placements par date narrative précise ; dès qu'il manque la précision
// nécessaire pour départager, repli automatique sur la date de sortie réelle.
function storyDateCompare(a, b){
  const pa = parseStoryDate(a._storyDate), pb = parseStoryDate(b._storyDate);
  if (pa.year !== pb.year) return pa.year - pb.year;
  if (pa.month != null && pb.month != null){
    if (pa.month !== pb.month) return pa.month - pb.month;
    if (pa.day != null && pb.day != null && pa.day !== pb.day) return pa.day - pb.day;
  }
  return (a.releaseDate||'').localeCompare(b.releaseDate||'');
}

function renderBoard(){
  const board = document.getElementById('board');
  const activeUniverses = sortMode === 'chrono' ? chronoUniverses : universes;
  const activeLinks = sortMode === 'chrono' ? chronoLinks : links;
  if (activeUniverses.length === 0){
    const label = sortMode === 'chrono' ? 'chronologiques' : "de l'ordre de sortie";
    board.innerHTML = `<div class="empty-msg">Aucun univers ${label} créé pour l'instant. Utilise "⚙ Univers" en admin pour commencer.</div>`;
    removeLinksSvg();
    return;
  }

  // Construit la liste d'éléments à placer sur la grille : en ordre de sortie, un
  // programme = une tuile (comportement inchangé). En chronologique, un programme
  // avec plusieurs placements devient plusieurs tuiles indépendantes.
  let items;
  if (sortMode === 'chrono'){
    let base = catalog.filter(d => Array.isArray(d.chronoPlacements) && d.chronoPlacements.length > 0);
    if (filterMode === 'mine') base = base.filter(d => isIncluded(d.id));
    items = [];
    base.forEach(d => {
      d.chronoPlacements.forEach(p => {
        items.push({
          ...d,
          id: d.id + '::' + p.id,
          _catalogId: d.id, _placementId: p.id,
          universe: p.universe, branch: p.branch || null,
          _storyDate: p.storyDate
        });
      });
    });
  } else {
    items = catalog.filter(d => d.universe);
    if (filterMode === 'mine') items = items.filter(d => isIncluded(d.id));
    items = items.map(d => ({ ...d, _catalogId: d.id, _placementId: null }));
  }

  const yearOf = sortMode === 'chrono'
    ? (d => (d._storyDate||'').slice(0,4) || '?')
    : (d => fmtYear(d) || '?');
  const dateSort = sortMode === 'chrono' ? storyDateCompare : ((a,b) => (a.releaseDate||'').localeCompare(b.releaseDate||''));

  // Construit la liste des colonnes : tronc de chaque univers, suivi de ses branches
  // — uniquement si au moins un programme y est visible (respecte le filtre en cours)
  const columns = [];
  activeUniverses.forEach(u => {
    const trunkItems = items.filter(d => d.universe===u.id && !d.branch);
    if (trunkItems.length > 0) columns.push({ type:'trunk', u, key:u.id });
    const bNames = [...new Set(items.filter(d => d.universe===u.id && d.branch).map(d=>d.branch))];
    bNames.forEach(bn => columns.push({ type:'branch', u, branchName:bn, key:u.id+'::'+bn }));
  });
  const itemsOfColumn = col => col.type==='trunk'
    ? items.filter(d => d.universe===col.u.id && !d.branch)
    : items.filter(d => d.universe===col.u.id && d.branch===col.branchName);

  // ── Navigation suivant/précédent pour la fiche détail :
  // priorité au fil automatique (ordre de la colonne), puis repli sur un lien manuel
  // (repli désactivé en mode Chronologique — un même programme peut apparaître
  // plusieurs fois, la correspondance lien→instance serait ambiguë) ──
  navNextOf = {}; navPrevOf = {};
  columns.forEach(col => {
    const ordered = itemsOfColumn(col).slice().sort(dateSort);
    for (let i = 0; i < ordered.length - 1; i++){
      const a = ordered[i], b = ordered[i+1];
      navNextOf[a.id] = { catalogId: b._catalogId, placementId: b._placementId };
      navPrevOf[b.id] = { catalogId: a._catalogId, placementId: a._placementId };
    }
  });
  if (sortMode === 'release'){
    links.forEach(l => {
      if (navNextOf[l.a] === undefined) navNextOf[l.a] = { catalogId: l.b, placementId: null };
      if (navPrevOf[l.b] === undefined) navPrevOf[l.b] = { catalogId: l.a, placementId: null };
    });
  }

  // Années réellement présentes (toutes colonnes confondues), triées
  const years = [...new Set(items.map(yearOf))].filter(y => y !== '?').sort();

  // Classement GLOBAL par date exacte à l'intérieur de chaque année (toutes colonnes
  // confondues) : chaque programme a sa propre ligne, même si un autre univers a
  // un programme la même année — pour ne jamais perdre l'ordre réel.
  const yearGroups = {};
  years.forEach(y => { yearGroups[y] = items.filter(d => yearOf(d) === y).sort(dateSort); });
  const yearRowCount = {};
  years.forEach(y => { yearRowCount[y] = yearGroups[y].length; });
  let cum = 0;
  const yearRowStart = {};
  years.forEach(y => { yearRowStart[y] = cum; cum += yearRowCount[y]; });
  const rankOf = {};
  years.forEach(y => { yearGroups[y].forEach((d, idx) => rankOf[d.id] = idx); });

  document.getElementById('board').style.setProperty('--n-uni', columns.length);

  let html = '';
  // Fonds de colonne : uniquement entre le premier et le dernier programme de la colonne
  columns.forEach((col, ci) => {
    const gcol = ci + 2;
    const rows = itemsOfColumn(col).map(d => 2 + yearRowStart[yearOf(d)] + rankOf[d.id]);
    if (rows.length === 0) return;
    const rowStart = Math.min(...rows), rowEnd = Math.max(...rows);
    html += `<div class="col-bg" style="grid-column:${gcol};grid-row:${rowStart} / span ${rowEnd - rowStart + 1};background:${hexToRgba(col.u.color, 0.15)}"></div>`;
  });
  years.forEach(y => {
    html += `<div class="year-label" style="grid-row:${2+yearRowStart[y]} / span ${yearRowCount[y]}">${y}</div>`;
  });
  columns.forEach((col, ci) => {
    const gcol = ci + 2; // colonne 1 = étiquettes d'années
    if (col.type === 'trunk'){
      html += `<div class="uni-head" style="grid-column:${gcol};border-color:${col.u.color}"><div class="uni-dot" style="background:${col.u.color}"></div><div class="uni-name">${col.u.name}</div></div>`;
    } else {
      html += `<div class="branch-head" style="grid-column:${gcol};border-color:${col.u.color}"><span class="branch-head-label" style="color:${col.u.color}">↳ ${col.branchName}</span></div>`;
    }
    itemsOfColumn(col).forEach(d => {
      const y = yearOf(d);
      const row = 2 + yearRowStart[y] + rankOf[d.id];
      html += cardHtml(d, col.u.color, gcol, row, col.key);
    });
  });
  board.innerHTML = html;

  renderMobileView(columns, items, itemsOfColumn, yearOf, dateSort);

  requestAnimationFrame(drawLinks);
  requestAnimationFrame(updateStickyOffset);
}

// ── Vue mobile : un univers (ou branche) à la fois, en liste, avec des badges de lien ──
let mobileActiveKey = null;
let mobileColumnsRef = [];
function renderMobileView(columns, items, itemsOfColumn, yearOf, dateSort){
  mobileColumnsRef = columns;
  if (columns.length === 0){
    document.getElementById('mobileTabs').innerHTML = '';
    document.getElementById('mobileList').innerHTML = '';
    return;
  }
  if (!mobileActiveKey || !columns.find(c => c.key === mobileActiveKey)){
    mobileActiveKey = columns[0].key;
  }
  const tabsBox = document.getElementById('mobileTabs');
  tabsBox.innerHTML = columns.map(col => {
    const label = col.type === 'trunk' ? col.u.name : `↳ ${col.branchName}`;
    const on = col.key === mobileActiveKey;
    const style = on ? `background:${col.u.color};border-color:${col.u.color};color:#fff` : `border-color:${col.u.color}66;color:${col.u.color}`;
    return `<button class="mtab" style="${style}" onclick="setMobileTab('${col.key}')">${label}</button>`;
  }).join('');

  const activeCol = columns.find(c => c.key === mobileActiveKey);
  const colItems = itemsOfColumn(activeCol).slice().sort(dateSort);
  const listBox = document.getElementById('mobileList');
  if (colItems.length === 0){
    listBox.innerHTML = '<div class="empty-msg">Aucun programme dans cette colonne pour l\'instant.</div>';
    return;
  }
  let html = '';
  let lastYear = null;
  colItems.forEach(d => {
    const y = yearOf(d);
    if (y !== lastYear){ html += `<div class="myear">${y}</div>`; lastYear = y; }
    html += `<div class="mlist-item">${cardHtmlMobile(d, activeCol.u.color, items, columns)}</div>`;
  });
  listBox.innerHTML = html;
}

function setMobileTab(key){
  mobileActiveKey = key;
  renderBoard();
}

function cardHtmlMobile(d, color, items, columns){
  const p = progress[d._catalogId] || {};
  const relatedLinks = activeLinkList().filter(l => l.a===d._catalogId || l.b===d._catalogId);
  const badges = relatedLinks.map(l => {
    const otherId = l.a===d._catalogId ? l.b : l.a;
    const otherPlacementId = l.a===d._catalogId ? l.bPlacementId : l.aPlacementId;
    const otherInstance = otherPlacementId
      ? items.find(x => x._catalogId===otherId && x._placementId===otherPlacementId)
      : items.find(x => x._catalogId===otherId);
    const other = catalog.find(x => x.id===otherId);
    if (!other) return '';
    const otherCol = otherInstance
      ? columns.find(c => c.key === (otherInstance.branch ? otherInstance.universe+'::'+otherInstance.branch : otherInstance.universe))
      : columns.find(c => c.type==='trunk' ? (c.u.id===other.universe && !other.branch) : (c.u.id===other.universe && other.branch===c.branchName));
    const otherColor = otherCol ? otherCol.u.color : '#888';
    const otherKey = otherCol ? otherCol.key : '';
    const isSuccessor = l.b === d._catalogId; // ce programme EST la suite de l'autre
    const catIcon = l.category === 'timetravel' ? '🕐' : '🌀';
    const label = l.label || (l.type==='reference' ? 'Référence' : (isSuccessor ? 'Précédent' : 'Suite'));
    return `<div class="mlink-badge" onclick='event.stopPropagation();jumpToMobile("${otherKey}","${otherId}")'>
      <span class="mlink-dot" style="background:${otherColor}"></span>${catIcon} ${label} : ${other.title}
    </div>`;
  }).join('');
  return `
    <div class="tcard ${p.watched?'watched':''} ${isAdmin?'has-assign':''}" data-card="${d._catalogId}" data-placement="${d._placementId||d._catalogId}" style="--uc:${color}" onclick="openDetail('${d._catalogId}','${d._placementId||''}')">
      ${isAdmin ? `<span class="tcard-assign" onclick="event.stopPropagation();openAssign('${d._catalogId}')" title="Assigner">⚙</span>` : ''}
      <div class="tcard-check" onclick="event.stopPropagation();toggleWatchedFor('${d._catalogId}')">${p.watched?'✓':''}</div>
      <div class="tcard-title">${d.title}</div>
      <div class="tcard-meta">${d._storyDate || fmtYear(d)} · ${d.type||''}</div>
      ${badges}
    </div>`;
}

function cardHtml(d, color, col, row, colKey){
  const p = progress[d._catalogId] || {};
  const metaYear = d._storyDate || fmtYear(d);
  return `
    <div class="tcard ${p.watched?'watched':''} ${isAdmin?'has-assign':''}" data-card="${d._catalogId}" data-placement="${d._placementId||d._catalogId}" data-colkey="${colKey}" style="--uc:${color};grid-column:${col};grid-row:${row}" onclick="openDetail('${d._catalogId}','${d._placementId||''}')">
      ${isAdmin ? `<span class="tcard-assign" onclick="event.stopPropagation();openAssign('${d._catalogId}')" title="Assigner">⚙</span>` : ''}
      <div class="tcard-check" onclick="event.stopPropagation();toggleWatchedFor('${d._catalogId}')">${p.watched?'✓':''}</div>

      <div class="tcard-meta">${metaYear} · ${d.type||''}</div>
    </div>`;

// ── Liens visuels entre cartes (SVG recalculé au resize/render) ──
function removeLinksSvg(){
  const old = document.getElementById('linksSvg');
  if (old) old.remove();
}
function drawLinks(){
  removeLinksSvg();
  const board = document.getElementById('board');
  const boardRect = board.getBoundingClientRect();

  // Le fil automatique par colonne se dessine dès qu'il y a au moins 2 cartes dans une colonne,
  // même s'il n'y a aucun lien manuel — donc on continue même si links.length === 0.
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('id','linksSvg');
  svg.classList.add('links-svg');
  svg.setAttribute('width', board.scrollWidth);
  svg.setAttribute('height', board.scrollHeight);

  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  svg.appendChild(defs);
  function ensureArrowMarker(color, id){
    if (defs.querySelector(`#${id}`)) return;
    const marker = document.createElementNS('http://www.w3.org/2000/svg','marker');
    marker.setAttribute('id', id);
    marker.setAttribute('viewBox','0 0 10 10');
    marker.setAttribute('refX','8'); marker.setAttribute('refY','5');
    marker.setAttribute('markerWidth','6'); marker.setAttribute('markerHeight','6');
    marker.setAttribute('orient','auto-start-reverse');
    const arrowPath = document.createElementNS('http://www.w3.org/2000/svg','path');
    arrowPath.setAttribute('d','M0,0L10,5L0,10z');
    arrowPath.setAttribute('fill', color);
    marker.appendChild(arrowPath);
    defs.appendChild(marker);
  }

  let any = false;

  // ── Fil automatique : relie les cartes consécutives d'une même colonne (tronc ou branche) ──
  const byCol = {};
  board.querySelectorAll('.tcard').forEach(el => {
    const k = el.dataset.colkey;
    (byCol[k] = byCol[k] || []).push(el);
  });
  Object.values(byCol).forEach(list => {
    if (list.length < 2) return;
    list.sort((a,b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top);
    const color = list[0].style.getPropertyValue('--uc') || 'var(--gold)';
    for (let i = 0; i < list.length - 1; i++){
      const ra = list[i].getBoundingClientRect(), rb = list[i+1].getBoundingClientRect();
      const x = ra.left - boardRect.left + ra.width/2;
      const y1 = ra.bottom - boardRect.top;
      const y2 = rb.top - boardRect.top;
      const spine = document.createElementNS('http://www.w3.org/2000/svg','line');
      spine.setAttribute('x1', x); spine.setAttribute('y1', y1);
      spine.setAttribute('x2', x); spine.setAttribute('y2', y2);
      spine.setAttribute('stroke', color);
      spine.setAttribute('stroke-width', '2');
      spine.setAttribute('opacity', '0.4');
      svg.appendChild(spine);
      any = true;
    }
  });

  // ── Liens manuels (créés par l'admin) : partent toujours du bas de A,
  // et ne voyagent que dans les couloirs vides entre lignes/colonnes de la grille.
  // Un lien "voyage dans le temps" cible une tuile précise si spécifiée ;
  // un lien "rencontre multiversielle" cible le programme au sens large. ──
  const activeLinksForDraw = sortMode === 'chrono' ? chronoLinks : links;
  activeLinksForDraw.forEach((l, i) => {
    const category = l.category || 'multiverse';
    const selA = (category === 'timetravel' && l.aPlacementId) ? `[data-placement="${l.aPlacementId}"]` : `[data-card="${l.a}"]`;
    const selB = (category === 'timetravel' && l.bPlacementId) ? `[data-placement="${l.bPlacementId}"]` : `[data-card="${l.b}"]`;
    const elA = board.querySelector(selA);
    const elB = board.querySelector(selB);
    if (!elA || !elB) return;
    any = true;
    const ra = elA.getBoundingClientRect(), rb = elB.getBoundingClientRect();

    // Couloir vertical : dans l'espace entre colonnes, jamais sur une carte
    const spaceRight = boardRect.right - ra.right;
    const goRight = spaceRight > 18;
    const fan = (i % 3 - 1) * 5; // écarte légèrement les liens qui partagent le même couloir
    const laneX = (goRight ? (ra.right - boardRect.left + 10) : (ra.left - boardRect.left - 10)) + fan;

    // On décale légèrement les points d'attache par rapport au centre exact de la carte,
    // pour ne jamais tomber pile sur le fil automatique de la colonne (qui passe au centre).
    const offset = 8;
    const centerA = ra.left - boardRect.left + ra.width/2;
    const x1 = centerA + (goRight ? offset : -offset);
    const y1 = ra.bottom - boardRect.top; // sort toujours par le bas de A

    const aMidY = ra.top + ra.height/2, bMidY = rb.top + rb.height/2;
    const bBelow = bMidY > aMidY;
    const centerB = rb.left - boardRect.left + rb.width/2;
    const x2 = centerB + (laneX > centerB ? offset : -offset);
    const y2 = (bBelow ? rb.top : rb.bottom) - boardRect.top; // entre par le côté qui fait face à A

    const gapDrop = 6;
    const y1b = y1 + gapDrop;
    const y2b = bBelow ? y2 - gapDrop : y2 + gapDrop;

    const isSequel = l.type !== 'reference';
    const colorA = elA.style.getPropertyValue('--uc') || '#C9973A';
    const markerId = 'arrow-' + i;
    if (isSequel) ensureArrowMarker(colorA, markerId);
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', `M${x1},${y1} L${x1},${y1b} L${laneX},${y1b} L${laneX},${y2b} L${x2},${y2b} L${x2},${y2}`);
    path.setAttribute('stroke-linejoin', 'round');
    path.setAttribute('stroke', colorA);
    path.setAttribute('stroke-width', isSequel ? '2' : '1.3');
    path.setAttribute('fill', 'none');
    if (!isSequel) path.setAttribute('stroke-dasharray', '4 3');
    path.setAttribute('opacity', isSequel ? '0.9' : '0.55');
    if (isSequel) path.setAttribute('marker-end', `url(#${markerId})`);
    svg.appendChild(path);

    const labelText = l.label || (isSequel ? 'Suite' : '');
    if (labelText){
      const text = document.createElementNS('http://www.w3.org/2000/svg','text');
      text.setAttribute('x', laneX);
      text.setAttribute('y', (y1b+y2b)/2 - 3);
      text.setAttribute('text-anchor','middle');
      text.setAttribute('class','link-label');
      text.textContent = labelText;
      svg.appendChild(text);
    }
  });
  if (any) board.appendChild(svg);
}
window.addEventListener('resize', () => requestAnimationFrame(drawLinks));

// ── Thème sombre / clair, mémorisé sur cet appareil ──
function getTheme(){ return localStorage.getItem('mm-theme') || 'dark'; }
function applyTheme(t){
  document.documentElement.classList.toggle('light', t === 'light');
  localStorage.setItem('mm-theme', t);
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = t === 'light' ? '☀️' : '🌙';
}
function toggleTheme(){ applyTheme(getTheme() === 'light' ? 'dark' : 'light'); }
applyTheme(getTheme());

// ── Export PNG haute résolution du tableau complet, quel que soit
// ce qui est actuellement visible à l'écran (défilé ou non) — génère
// une version fond sombre ET une version fond clair en un seul clic ──
async function downloadBoardPNG(el, bgColor, filename){
  const canvas = await html2canvas(el, {
    backgroundColor: bgColor,
    scale: 3,
    useCORS: true,
    allowTaint: true
  });
  const link = document.createElement('a');
  link.download = filename;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

async function exportTimelinePNG(){
  const board = document.getElementById('board');
  const btn = document.getElementById('exportPdfBtn');
  const original = btn.textContent;
  const userTheme = getTheme(); // pour le restaurer une fois l'export terminé
  btn.disabled = true;
  try {
    applyTheme('dark');
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    btn.textContent = '⏳ Version sombre...';
    await downloadBoardPNG(board, '#111111', 'marvel-timelines-sombre.png');
    await new Promise(r => setTimeout(r, 400));

    applyTheme('light');
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))); // laisse le temps au style de s'appliquer
    btn.textContent = '⏳ Version claire...';
    await downloadBoardPNG(board, '#ffffff', 'marvel-timelines-claire.png');
  } catch(err){
    alert('Erreur export : ' + err.message);
  } finally {
    applyTheme(userTheme);
    btn.textContent = original;
    btn.disabled = false;
  }
}

// ── Gestion des univers (admin) — collection distincte selon le mode actif ──
function universeCollectionName(){ return sortMode === 'chrono' ? 'chronoUniverses' : 'universes'; }
function activeUniverseList(){ return sortMode === 'chrono' ? chronoUniverses : universes; }

function openUniverseMgr(){
  document.getElementById('universeMgrTitle').textContent = sortMode === 'chrono' ? 'Gérer les univers (Chronologique)' : 'Gérer les univers (Ordre de sortie)';
  renderUniverseMgr();
  document.getElementById('universeMgrOverlay').classList.add('open');
}
function renderUniverseMgr(){
  const list = activeUniverseList();
  const box = document.getElementById('universeMgrList');
  box.innerHTML = list.map((u,i) => `
    <div class="unimgr-row">
      <div class="unimgr-order">
        <button onclick="moveUniverse('${u.id}',-1)" ${i===0?'disabled':''}>▲</button>
        <button onclick="moveUniverse('${u.id}',1)" ${i===list.length-1?'disabled':''}>▼</button>
      </div>
      <input type="color" value="${u.color}" onchange="recolorUniverse('${u.id}', this.value)">
      <input type="text" value="${u.name}" onchange="renameUniverse('${u.id}', this.value)">
      <button class="unimgr-del" onclick="deleteUniverse('${u.id}','${u.name.replace(/'/g,"\\'")}')">🗑</button>
    </div>`).join('') || '<div class="empty-msg">Aucun univers.</div>';
}
function addUniverse(){
  const name = document.getElementById('newUniName').value.trim();
  const color = document.getElementById('newUniColor').value;
  if (!name) return;
  const order = activeUniverseList().length;
  db.collection(universeCollectionName()).add({ name, color, order }).then(() => { document.getElementById('newUniName').value=''; });
}
function recolorUniverse(id, color){ db.collection(universeCollectionName()).doc(id).update({ color }); }
function renameUniverse(id, name){ name=name.trim(); if(name) db.collection(universeCollectionName()).doc(id).update({ name }); }
async function moveUniverse(id, dir){
  const list = activeUniverseList();
  const idx = list.findIndex(u => u.id === id);
  const swapIdx = idx + dir;
  if (swapIdx < 0 || swapIdx >= list.length) return;
  const a = list[idx], b = list[swapIdx];
  const batch = db.batch();
  const coll = universeCollectionName();
  batch.update(db.collection(coll).doc(a.id), { order: b.order });
  batch.update(db.collection(coll).doc(b.id), { order: a.order });
  await batch.commit();
}
async function deleteUniverse(id, name){
  const isChrono = sortMode === 'chrono';
  const affectedIds = isChrono
    ? catalog.filter(d => Array.isArray(d.chronoPlacements) && d.chronoPlacements.some(p => p.universe === id)).map(d => d.id)
    : catalog.filter(d => d.universe === id).map(d => d.id);
  const msg = affectedIds.length > 0
    ? `${affectedIds.length} programme(s) référencent "${name}" et perdront cette assignation. Continuer ?`
    : `Supprimer l'univers "${name}" ?`;
  if (!confirm(msg)) return;
  const batch = db.batch();
  affectedIds.forEach(cid => {
    const d = catalog.find(x => x.id === cid);
    if (isChrono){
      const cleaned = d.chronoPlacements.filter(p => p.universe !== id);
      batch.update(db.collection('catalog').doc(cid), { chronoPlacements: cleaned.length ? cleaned : firebase.firestore.FieldValue.delete() });
    } else {
      batch.update(db.collection('catalog').doc(cid), { universe: firebase.firestore.FieldValue.delete(), branch: firebase.firestore.FieldValue.delete() });
    }
  });
  batch.delete(db.collection(universeCollectionName()).doc(id));
  await batch.commit();
}

// ── Assignation d'un programme ──
let assigningId = null;
let currentAssignPlacements = [];
function openAssign(id){
  assigningId = id;
  const d = catalog.find(x => x.id === id);
  if (!d) return;
  document.getElementById('assignTitle').textContent = d.title;
  document.getElementById('assignUniverse').innerHTML = '<option value="">— Aucun —</option>' + universes.map(u=>`<option value="${u.id}">${u.name}</option>`).join('');
  document.getElementById('assignUniverse').value = d.universe || '';
  document.getElementById('assignBranch').value = d.branch || '';
  currentAssignPlacements = (d.chronoPlacements || []).map(p => ({...p}));
  renderPlacementList();
  document.getElementById('assignOverlay').classList.add('open');
}
function renderPlacementList(){
  const box = document.getElementById('placementList');
  box.innerHTML = currentAssignPlacements.map((p, i) => `
    <div class="placement-row">
      <select onchange="updatePlacement(${i},'universe',this.value)">${chronoUniverses.map(u=>`<option value="${u.id}" ${p.universe===u.id?'selected':''}>${u.name}</option>`).join('')}</select>
      <input type="text" placeholder="Branche (optionnel)" value="${p.branch||''}" onchange="updatePlacement(${i},'branch',this.value)">
      <input type="text" class="pdate" placeholder="AAAA[-MM[-JJ]]" value="${p.storyDate||''}" onchange="updatePlacement(${i},'storyDate',this.value)">
      <button class="placement-del" onclick="removePlacementRow(${i})">🗑</button>
    </div>`).join('') || '<div class="empty-msg" style="padding:8px 0">Aucun placement chronologique — ce programme n\'apparaîtra pas en mode Chronologique.</div>';
}
function updatePlacement(i, field, value){ currentAssignPlacements[i][field] = value.trim(); }
function addPlacementRow(){
  currentAssignPlacements.push({ id: 'p_'+Date.now()+'_'+Math.floor(Math.random()*1000), universe: chronoUniverses[0]?.id||'', branch:'', storyDate:'' });
  renderPlacementList();
}
function removePlacementRow(i){ currentAssignPlacements.splice(i,1); renderPlacementList(); }

function saveAssign(){
  if (!assigningId) return;
  const universe = document.getElementById('assignUniverse').value;
  const branch = document.getElementById('assignBranch').value.trim();
  const update = {};
  update.universe = universe ? universe : firebase.firestore.FieldValue.delete();
  update.branch = branch ? branch : firebase.firestore.FieldValue.delete();
  const validPlacements = currentAssignPlacements.filter(p => p.universe && p.storyDate);
  update.chronoPlacements = validPlacements.length ? validPlacements : firebase.firestore.FieldValue.delete();
  db.collection('catalog').doc(assigningId).update(update)
    .then(() => closeOverlay('assignOverlay'))
    .catch(err => alert('Erreur : ' + err.message));
}
function openAssignFromDetail(){
  if (!currentDetailId) return;
  closeOverlay('detailOverlay');
  openAssign(currentDetailId);
}

// ── Assignation en masse (bouton "📌 Affecter des programmes") ──
let bulkUniverseId = null;
function openBulkAssignPicker(){
  const select = document.getElementById('bulkUniverseSelect');
  select.innerHTML = universes.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
  bulkUniverseId = universes.length ? universes[0].id : null;
  document.getElementById('bulkSearch').value = '';
  renderBulkList();
  document.getElementById('bulkAssignOverlay').classList.add('open');
}
function onBulkUniverseChange(){
  bulkUniverseId = document.getElementById('bulkUniverseSelect').value;
}
function renderBulkList(){
  const q = document.getElementById('bulkSearch').value.toLowerCase();
  const unassigned = catalog
    .filter(d => !d.universe)
    .filter(d => !q || d.title.toLowerCase().includes(q))
    .sort((a,b) => a.title.localeCompare(b.title));
  const box = document.getElementById('bulkList');
  box.innerHTML = unassigned.map(d => `
    <label class="bulk-row">
      <input type="checkbox" class="bulk-check" value="${d.id}">
      <span>${d.title} <span style="color:var(--muted)">(${d.type||''}${d.year?' · '+d.year:''})</span></span>
    </label>`).join('') || '<div class="empty-msg">Tous les programmes sont déjà affectés à un univers.</div>';
}
function bulkCheckAll(value){
  document.querySelectorAll('.bulk-check').forEach(c => c.checked = value);
}
function confirmBulkAssign(){
  if (!bulkUniverseId) return;
  const ids = [...document.querySelectorAll('.bulk-check:checked')].map(c => c.value);
  if (ids.length === 0) return;
  const batch = db.batch();
  ids.forEach(id => batch.update(db.collection('catalog').doc(id), { universe: bulkUniverseId }));
  batch.commit()
    .then(() => closeOverlay('bulkAssignOverlay'))
    .catch(err => alert('Erreur : ' + err.message));
}

// ── Créateur de liens ──
function linkCollectionName(){ return sortMode === 'chrono' ? 'chronoLinks' : 'links'; }
function activeLinkList(){ return sortMode === 'chrono' ? chronoLinks : links; }

function openLinkMgr(){
  const opts = catalog.slice().sort((a,b)=>a.title.localeCompare(b.title)).map(d=>`<option value="${d.id}">${d.title}</option>`).join('');
  document.getElementById('linkA').innerHTML = opts;
  document.getElementById('linkB').innerHTML = opts;
  document.getElementById('linkLabel').value = '';
  document.getElementById('linkMgrTitle').textContent = sortMode === 'chrono' ? 'Liens entre programmes (Chronologique)' : 'Liens entre programmes (Ordre de sortie)';
  document.getElementById('linkCategoryField').style.display = sortMode === 'chrono' ? 'block' : 'none';
  document.getElementById('linkCategory').value = 'multiverse';
  onLinkCategoryChange();
  renderLinkList();
  document.getElementById('linkMgrOverlay').classList.add('open');
}
function onLinkCategoryChange(){
  const cat = sortMode === 'chrono' ? document.getElementById('linkCategory').value : 'multiverse';
  document.getElementById('linkAPlacementField').style.display = cat==='timetravel' ? 'block' : 'none';
  document.getElementById('linkBPlacementField').style.display = cat==='timetravel' ? 'block' : 'none';
  if (cat === 'timetravel') onLinkProgramChange();
}
function onLinkProgramChange(){
  if (sortMode !== 'chrono' || document.getElementById('linkCategory').value !== 'timetravel') return;
  fillPlacementSelect('linkA', 'linkAPlacement');
  fillPlacementSelect('linkB', 'linkBPlacement');
}
function fillPlacementSelect(programSelectId, placementSelectId){
  const catalogId = document.getElementById(programSelectId).value;
  const d = catalog.find(x => x.id === catalogId);
  const placements = (d && d.chronoPlacements) || [];
  const sel = document.getElementById(placementSelectId);
  sel.innerHTML = placements.length
    ? placements.map(p => `<option value="${p.id}">${p.storyDate}${p.branch?' — '+p.branch:''}</option>`).join('')
    : '<option value="">— Aucun placement chronologique —</option>';
}
function renderLinkList(){
  const box = document.getElementById('linkList');
  box.innerHTML = activeLinkList().map(l => {
    const a = catalog.find(d=>d.id===l.a), b = catalog.find(d=>d.id===l.b);
    const arrow = l.type === 'reference' ? '↔' : '→';
    const catIcon = l.category === 'timetravel' ? '🕐' : (sortMode === 'chrono' ? '🌀' : '');
    return `<div class="link-row">
      <span class="link-txt">${catIcon} ${a?a.title:'?'} ${arrow} ${b?b.title:'?'}${l.label?' — '+l.label:''}</span>
      <button class="link-del" onclick="deleteLink('${l.id}')">🗑</button>
    </div>`;
  }).join('') || '<div class="empty-msg">Aucun lien.</div>';
}
function addLink(){
  const a = document.getElementById('linkA').value;
  const b = document.getElementById('linkB').value;
  const type = document.getElementById('linkType').value;
  const label = document.getElementById('linkLabel').value.trim();
  if (!a || !b || a === b) return alert('Choisis deux programmes différents.');
  const entry = { a, b, type, label };
  if (sortMode === 'chrono'){
    const category = document.getElementById('linkCategory').value;
    entry.category = category;
    if (category === 'timetravel'){
      const aPid = document.getElementById('linkAPlacement').value;
      const bPid = document.getElementById('linkBPlacement').value;
      if (aPid) entry.aPlacementId = aPid;
      if (bPid) entry.bPlacementId = bPid;
    }
  }
  db.collection(linkCollectionName()).add(entry).then(() => { document.getElementById('linkLabel').value=''; renderLinkList(); });
}
function deleteLink(id){
  if (!confirm('Supprimer ce lien ?')) return;
  db.collection(linkCollectionName()).doc(id).delete();
}

// ── Fiche programme simplifiée ──
function openDetail(id, placementId){
  const d = catalog.find(x => x.id === id);
  if (!d) return;
  currentDetailId = id;
  currentDetailPlacementId = placementId || null;
  const p = progress[id] || {};
  document.getElementById('detailPoster').src = d.poster || '';
  document.getElementById('detailTitle').textContent = d.title;
  document.getElementById('detailMeta').textContent = `${d.studio||''} · ${d.type||''} · ${d.year||''}`;
  const wBtn = document.getElementById('detailWatchBtn');
  wBtn.textContent = p.watched ? '✓ Vu' : 'Marquer comme vu';
  document.getElementById('detailAssignBtn').style.display = isAdmin ? 'inline-block' : 'none';
  const navKey = currentDetailPlacementId ? (currentDetailId+'::'+currentDetailPlacementId) : currentDetailId;
  document.getElementById('detailPrevBtn').disabled = !navPrevOf[navKey];
  document.getElementById('detailNextBtn').disabled = !navNextOf[navKey];

  const relLinks = activeLinkList().filter(l => l.a===id || l.b===id);
  document.getElementById('detailLinks').innerHTML = relLinks.map(l => {
    const otherId = l.a===id ? l.b : l.a;
    const otherPlacementId = l.a===id ? l.bPlacementId : l.aPlacementId;
    const other = catalog.find(x => x.id === otherId);
    if (!other) return '';
    const catIcon = l.category === 'timetravel' ? '🕐' : '🌀';
    const isSuccessor = l.b === id; // ce programme EST la suite de l'autre
    const label = l.label || (l.type==='reference' ? 'Référence' : (isSuccessor ? 'Précédent' : 'Suite'));
    return `<div class="mlink-badge" onclick="openDetail('${otherId}'${otherPlacementId?`,'${otherPlacementId}'`:''})">${catIcon} ${label} : ${other.title}</div>`;
  }).join('');

  document.getElementById('detailOverlay').classList.add('open');
}
function detailNav(dir){
  if (!currentDetailId) return;
  const navKey = currentDetailPlacementId ? (currentDetailId+'::'+currentDetailPlacementId) : currentDetailId;
  const target = dir < 0 ? navPrevOf[navKey] : navNextOf[navKey];
  if (target) openDetail(target.catalogId, target.placementId);
}
function toggleDetailWatched(){
  if (!currentDetailId) return;
  toggleWatchedFor(currentDetailId);
  const p = progress[currentDetailId] || {};
  document.getElementById('detailWatchBtn').textContent = !p.watched ? '✓ Vu' : 'Marquer comme vu';
}

document.addEventListener('keydown', e => {
  if (!document.getElementById('detailOverlay').classList.contains('open')) return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); detailNav(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); detailNav(1); }
  else if (e.key === 'Escape') { closeOverlay('detailOverlay'); }
});

(function initDetailSwipe(){
  const modal = document.getElementById('detailModal');
  if (!modal) return;
  let startX = 0, startY = 0, tracking = false;
  modal.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX; startY = e.touches[0].clientY; tracking = true;
  }, { passive:true });
  modal.addEventListener('touchend', e => {
    if (!tracking) return;
    tracking = false;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){
      detailNav(dx < 0 ? 1 : -1);
    }
  }, { passive:true });
})();
